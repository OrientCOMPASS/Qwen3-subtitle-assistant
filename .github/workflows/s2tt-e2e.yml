# ============================================================================
# S2TT 端到端实验：微调后的 Qwen3-ASR 直出中文字幕，全程无 LLM 后处理。
#
# 回答的问题：把 real-mini 微调出的 LoRA 适配器「融合」进主程序形态
# （ffmpeg → VAD → ASR → 排版 → SRT），省掉 1.7B LLM 的质检/摘要/翻译/审校
# 四段之后，真实日语视频的字幕质量还剩多少？
#
# 设计：
#   * 不重新编译 Rust——用 finetune/s2tt_pipeline.py 在 PyTorch 运行时上复刻
#     产品管线（同款 VAD 语义、同款折行/长 cue 拆分规则、language None 段丢弃
#     替代 LLM 质检），CPU float32；
#   * 实验组 = 适配器 + context="translate to Chinese"（直出中文）；
#     对照组 = 同一适配器不带 context（应仍出日语）——在真实视频上验证任务开关；
#   * 基线 = master 产品 CI（两段式：ASR→LLM）对同一视频的最终字幕，
#     从 master 最新 e2e-results artifact 取，三方对照打印；
#   * 媒体复用 master 建好的 bilibili 缓存（e2e-media-bilibili-v3），不重新下载；
#   * 适配器复用 real-mini run 的 s2tt-real-mini artifact（默认 36238661344），
#     不重新训练。
#
# 为什么必须跑在 windows-latest（实测踩过，run 36243911058）：
#   媒体缓存是 master CI 在 windows runner 上存的，actions/cache 默认
#   enableCrossOsArchive=false，**跨 OS 不能还原**——ubuntu 上 restore 必 miss。
#   probe.yml 同样为此选 windows。PyTorch CPU + qwen-asr 在 windows runner
#   已由 probe.yml 的交叉验证步骤证明可行。含 bash 语法的步骤显式 shell: bash
#   （windows runner 自带 git-bash）。
#
# 注：GitHub 只索引「默认分支上存在」或「曾经运行过」的 workflow。本文件已借
# 首次 push 触发完成注册（run 36243911058），此后仅手动触发。
# ============================================================================
name: s2tt-e2e

on:
  workflow_dispatch:
    inputs:
      bvid:
        description: "测试视频 BV 号（须在媒体缓存里）"
        type: string
        default: "BV16r421g797"
      adapter_run:
        description: "s2tt-real-mini 适配器所在 run id"
        type: string
        default: "36238661344"
      modes:
        description: "translate=只跑直出中文；both=加跑不带 context 的日语对照"
        type: choice
        default: "both"
        options: [both, translate, transcribe]
      max_seconds:
        description: "只处理视频前 N 秒（0 = 全部；CPU 上 3 分钟视频双模式约 20~30 分钟）"
        type: string
        default: "0"
      model:
        description: "基座模型（须与适配器训练基座一致）"
        type: choice
        default: "Qwen/Qwen3-ASR-0.6B"
        options: [Qwen/Qwen3-ASR-0.6B, Qwen/Qwen3-ASR-1.7B]

permissions:
  contents: read
  actions: read   # 跨 run 下载适配器与 master e2e 产物需要

concurrency:
  # 分组带上 bvid/adapter/model：不同视频/模型的实验可以并行，互不取消
  # （实测教训：两个 dispatch 同组，后一个把前一个秒杀了）
  group: s2tt-e2e-${{ github.ref }}-${{ inputs.bvid || 'default' }}-${{ inputs.adapter_run || 'default' }}-${{ inputs.model || 'default' }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TOKENIZERS_PARALLELISM: "false"
  BVID: ${{ inputs.bvid || 'BV16r421g797' }}
  ADAPTER_RUN: ${{ inputs.adapter_run || '36238661344' }}
  MODES: ${{ inputs.modes || 'both' }}
  MAX_SECS: ${{ inputs.max_seconds || '0' }}
  MODEL: ${{ inputs.model || 'Qwen/Qwen3-ASR-0.6B' }}
  MODEL_TAG: ${{ inputs.model == 'Qwen/Qwen3-ASR-1.7B' && '1.7B' || '0.6B' }}

jobs:
  e2e:
    name: S2TT 直出字幕（无 LLM 后处理）
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Console UTF-8
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 ffmpeg / ffprobe（媒体解码）
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y | Out-Null
          RefreshEnv
          ffmpeg -version | Select-Object -First 1

      # HF 模型缓存：finetune.yml 的缓存建在 ubuntu（跨 OS 不可还原），
      # 这里用 windows 专属 key；首次 miss 会下载 ~1.8GB，之后命中。
      - name: Cache HuggingFace 模型（windows key 按基座区分；1.7B 首次 miss 下载 ~3.4GB）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-asr-${{ env.MODEL_TAG }}-win-v1

      - name: 安装依赖（CPU torch + qwen-asr + peft + silero-vad）
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet qwen-asr peft soundfile librosa "silero-vad>=5.1,<7"
          python -c "import torch, silero_vad, importlib.metadata as md; print('torch', torch.__version__, '| silero-vad', md.version('silero-vad'), '| qwen-asr', md.version('qwen-asr'))"

      - name: 下载 LoRA 适配器（来自 real-mini run）
        uses: actions/download-artifact@v4
        with:
          name: s2tt-real-mini
          run-id: ${{ env.ADAPTER_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: art

      - name: 校验适配器
        shell: bash
        run: |
          ls -la art/out/real/lora/
          test -f art/out/real/lora/adapter_model.safetensors || \
            test -f art/out/real/lora/adapter_model.bin || \
            { echo "::error::适配器权重缺失"; exit 1; }

      - name: 取 master 最新带 e2e-results 的 run（两段式管线基线）
        id: find-master
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          tok = os.environ["GITHUB_TOKEN"]; repo = os.environ["GITHUB_REPOSITORY"]
          def api(u):
              r = urllib.request.Request(u)
              r.add_header("Authorization", f"Bearer {tok}")
              r.add_header("Accept", "application/vnd.github+json")
              return json.loads(urllib.request.urlopen(r, timeout=60).read())
          runs = api(f"https://api.github.com/repos/{repo}/actions/runs?branch=master&per_page=30")["workflow_runs"]
          pick = None
          for run in runs:
              arts = api(run["artifacts_url"] + "?per_page=30")["artifacts"]
              if any(a["name"] == "e2e-results" for a in arts):
                  pick = run; break
          if pick:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"run-id={pick['id']}\n")
              print("master e2e 基线 run:", pick["id"], pick["head_sha"][:8])
          else:
              print("::warning::找不到带 e2e-results 的 master run，跳过三方对照")
          PY

      - name: 下载 master 基线字幕
        if: steps.find-master.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-results
          run-id: ${{ steps.find-master.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: master_e2e

      - name: 还原测试媒体缓存
        uses: actions/cache/restore@v4
        with:
          path: media-cache
          key: e2e-media-bilibili-v3
          fail-on-cache-miss: true

      - name: 选定测试视频
        shell: bash
        run: |
          set -e
          mkdir -p media/out
          echo "缓存内容:"; ls -la media-cache/
          f=$(ls media-cache/ | grep "$BVID" | head -1 || true)
          if [ -z "$f" ]; then echo "::error::缓存里没有 $BVID"; exit 1; fi
          ext="${f##*.}"
          cp "media-cache/$f" "media/test.$ext"
          echo "MEDIA=media/test.$ext" >> "$GITHUB_ENV"
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "media/test.$ext")
          echo "视频: $f 时长 ${dur}s"

      - name: 实验组：适配器 + context 直出中文（无 LLM）
        if: env.MODES == 'both' || env.MODES == 'translate'
        shell: bash
        run: |
          set -o pipefail
          python finetune/s2tt_pipeline.py --media "$MEDIA" \
            --model "$MODEL" --adapter art/out/real/lora \
            --context "translate to Chinese" \
            --max-seconds "$MAX_SECS" \
            --out media/out/translate.srt --stats media/out/translate.stats.json \
            2>&1 | tee media/out/translate.log

      - name: 对照组：同一适配器不带 context（应仍出日语）
        if: env.MODES == 'both' || env.MODES == 'transcribe'
        shell: bash
        run: |
          set -o pipefail
          python finetune/s2tt_pipeline.py --media "$MEDIA" \
            --model "$MODEL" --adapter art/out/real/lora --context "" \
            --max-seconds "$MAX_SECS" \
            --out media/out/transcribe.srt --stats media/out/transcribe.stats.json \
            2>&1 | tee media/out/transcribe.log

      - name: 判定 + 三方对照报告
        shell: bash
        run: |
          set -o pipefail
          python scripts/s2tt_e2e_report.py \
            --bvid "$BVID" --modes "$MODES" \
            --out-dir media/out --master-dir master_e2e \
            2>&1 | tee verdict-report.txt

      - name: 上传实验产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2tt-e2e-results-${{ env.MODEL_TAG }}
          path: |
            media/out/*.srt
            media/out/*.json
            media/out/*.log
            verdict-report.txt
          if-no-files-found: warn
          retention-days: 30
