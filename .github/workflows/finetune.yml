# ============================================================================
# Qwen3-ASR -> S2TT（日语语音直接输出中文字幕）微调实验。
#
# 只在 exp/asr-s2tt 分支上跑，不影响 master 的 ci.yml。
#
# 两种模式：
#   cpu-smoke（默认，GitHub 托管 runner）：4 条样本 + 2 步 LoRA，**只验证管线可跑通**
#       （数据格式、prefix/target 切分、labels 掩码、训练回路、适配器保存与挂载、评测脚本）。
#       用 stub 伪翻译，因此翻译质量指标必然不达标——这是预期的，不作为失败。
#   gpu-train（需要 self-hosted + gpu 标签的 runner）：真实训练，用 --translator api
#       调 OpenAI 兼容端点做日->中翻译，产出可用的 LoRA 适配器。
#
# 为什么托管 runner 只能冒烟：GitHub 托管 runner 无 GPU，而 0.6B 音频 LLM 的全量训练
# 在 4 vCPU 上不可行；质量验证必须上 GPU（见 finetune/README.md 的硬件表）。
# ============================================================================
name: finetune-experiment

on:
  push:
    branches: [exp/asr-s2tt]
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        default: "cpu-smoke"
        options: [cpu-smoke, gpu-train]
      model:
        description: "基座模型"
        type: choice
        default: "Qwen/Qwen3-ASR-0.6B"
        options: [Qwen/Qwen3-ASR-0.6B, Qwen/Qwen3-ASR-1.7B]
      samples:
        description: "训练样本数（gpu-train 建议 >= 2000）"
        type: string
        default: "4"
      steps:
        description: "最大训练步数（-1 = 按 epochs 走完）"
        type: string
        default: "2"
      translator:
        description: "翻译后端（gpu-train 请用 api）"
        type: choice
        default: "stub"
        options: [stub, api]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  cpu-smoke:
    name: CPU 管线冒烟（非质量验证）
    if: ${{ inputs.mode != 'gpu-train' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache HuggingFace 模型（0.6B 约 1.8GB）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-asr-0.6B-v1

      - name: 安装依赖（CPU 版 torch + qwen-asr + peft）
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          # qwen-asr 会锁定 transformers==4.57.6 / accelerate==1.12.0
          pip install --quiet qwen-asr peft datasets soundfile librosa
          python -c "import torch, transformers, peft, qwen_asr; \
            print('torch', torch.__version__, '| transformers', transformers.__version__, \
                  '| peft', peft.__version__, '| qwen-asr', qwen_asr.__version__)"

      - name: 构造数据（FLEURS ja_jp + stub 伪翻译）
        run: |
          python finetune/prepare_data.py \
            --source fleurs --limit 4 --eval-limit 2 \
            --max-audio-secs 12 --translator stub --asr-ratio 0.5 \
            --audio-dir data/audio --out data/train.jsonl --eval-out data/eval.jsonl
          echo "--- train.jsonl（首行，audio 路径已截断）---"
          python -c "import json;l=open('data/train.jsonl',encoding='utf-8').readline();d=json.loads(l);d['audio']='...'+d['audio'][-24:];print(json.dumps(d,ensure_ascii=False,indent=2))"
          wc -l data/train.jsonl data/eval.jsonl

      - name: LoRA 微调 2 步（CPU）
        run: |
          python finetune/sft_lora.py \
            --model Qwen/Qwen3-ASR-0.6B --train data/train.jsonl --eval data/eval.jsonl \
            --out out/smoke --device cpu --lora --lora-r 8 \
            --max-samples 4 --max-steps 2 --batch-size 1 --grad-acc 1 --lr 2e-4 --log-steps 1

      - name: 评测（CPU；stub 数据下质量指标不达标属预期）
        run: |
          python finetune/eval_s2tt.py \
            --model Qwen/Qwen3-ASR-0.6B --adapter out/smoke/lora \
            --eval data/eval.jsonl --limit 2 --device cpu --silence-secs 2 \
            --out out/smoke/eval_report.json

      - name: 管线冒烟判定
        run: |
          python - <<'PY'
          import json, math, pathlib
          rep = json.loads(pathlib.Path('out/smoke/train_report.json').read_text(encoding='utf-8'))
          ev = json.loads(pathlib.Path('out/smoke/eval_report.json').read_text(encoding='utf-8'))
          fails = []
          loss = rep.get('final_loss')
          if not isinstance(loss, float) or not math.isfinite(loss) or loss <= 0:
              fails.append(f'final_loss 异常: {loss!r}')
          if rep.get('train_samples', 0) < 1:
              fails.append('训练样本数为 0')
          if rep.get('trainable_params_m', 0) <= 0:
              fails.append('LoRA 可训练参数为 0（适配器没挂上）')
          if not ev.get('translated_samples') and not ev.get('transcribed_samples'):
              fails.append('评测没有任何输出样本')
          if 'silence' in ev and ev['silence'].get('error'):
              fails.append(f"静音推理报错: {ev['silence']['error']}")
          print('=== 管线冒烟结论 ===')
          print(f"  final_loss        = {loss}")
          print(f"  可训练参数(M)     = {rep.get('trainable_params_m')}")
          print(f"  训练耗时(s)       = {rep.get('train_seconds')}")
          print(f"  翻译组输出假名占比 = {ev['metrics']['translated_avg_kana']}")
          print(f"  转写组输出假名占比 = {ev['metrics']['transcribed_avg_kana']}")
          print(f"  静音输出          = {ev.get('silence')}")
          print('注意：本轮用 stub 伪翻译 + CPU + 2 步，翻译质量指标不达标是预期行为，')
          print('      本判定只检查"管线是否跑通"。质量验证请用 gpu-train 模式。')
          if fails:
              print('失败项:', fails)
              raise SystemExit(1)
          print('✔ 数据格式 / prefix-target 切分 / 训练回路 / 适配器保存与挂载 / 评测脚本 全部跑通')
          PY

      - name: 上传实验产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2tt-cpu-smoke
          path: |
            out/smoke/train_report.json
            out/smoke/eval_report.json
            data/train.jsonl
            data/eval.jsonl
          if-no-files-found: warn
          retention-days: 30

  gpu-train:
    name: GPU 真实训练（需 self-hosted + gpu runner）
    if: ${{ inputs.mode == 'gpu-train' }}
    runs-on: [self-hosted, gpu]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          set -e
          pip install --quiet --upgrade pip
          pip install --quiet qwen-asr peft datasets soundfile librosa
          # FlashAttention-2 可显著省显存/提速（需要 Ampere+）；失败不阻塞
          MAX_JOBS=4 pip install -U flash-attn --no-build-isolation || echo "flash-attn 安装失败，继续"
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else '')"

      - name: 构造数据（FLEURS ja_jp + API 翻译）
        env:
          S2TT_API_KEY: ${{ secrets.S2TT_API_KEY }}
        run: |
          python finetune/prepare_data.py \
            --source fleurs --limit ${{ inputs.samples }} --eval-limit 40 \
            --max-audio-secs 20 --translator ${{ inputs.translator }} \
            --api-base "${{ vars.S2TT_API_BASE }}" --api-model "${{ vars.S2TT_API_MODEL }}" \
            --api-key-env S2TT_API_KEY --asr-ratio 0.5 \
            --audio-dir data/audio --out data/train.jsonl --eval-out data/eval.jsonl
          wc -l data/train.jsonl data/eval.jsonl

      - name: LoRA 微调
        run: |
          python finetune/sft_lora.py \
            --model "${{ inputs.model }}" --train data/train.jsonl --eval data/eval.jsonl \
            --out out/s2tt --lora --lora-r 16 --lora-alpha 32 \
            --epochs 1 --max-steps ${{ inputs.steps }} --batch-size 4 --grad-acc 4 \
            --lr 2e-4 --warmup-steps 50 --log-steps 10 --save-steps 200 --grad-ckpt

      - name: 评测（翻译是否生效 / 是否遗忘 / 静音行为）
        run: |
          python finetune/eval_s2tt.py \
            --model "${{ inputs.model }}" --adapter out/s2tt/lora \
            --eval data/eval.jsonl --limit 40 --silence-secs 2 \
            --out out/s2tt/eval_report.json

      - name: 上传适配器与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2tt-lora-adapter
          path: |
            out/s2tt/lora
            out/s2tt/train_report.json
            out/s2tt/eval_report.json
          if-no-files-found: warn
          retention-days: 90
