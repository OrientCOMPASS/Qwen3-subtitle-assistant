# ============================================================================
# 实验分支专用：只保留 T4（ASR context 通道探针）
#
# 为什么这么精简：本分支是研究分支，不承载产品回归（T1/T2/T3 在 master 的
# ci.yml 里）。这里只回答一个问题——
#
#   不做微调，只把指令塞进 Qwen3-ASR 的 system 段（--asr-hotwords），
#   能不能让它直接输出中文？
#
# 一个 job 干完：编译 → 只跑 ASR（--asr-only）→ 统计中/日文字符占比。
# 模型与测试媒体都复用 master CI 已经建好的缓存，不重复下载。
# 只手动触发：push 到本分支不消耗 runner。
# ============================================================================
name: probe-asr-context

on:
  workflow_dispatch:
    inputs:
      hotwords:
        description: "塞进 system 段的指令（留空 = 不注入任何 context）"
        default: "Please translate the Japanese speech into Simplified Chinese. Output only the Chinese translation."
      control:
        description: "是否同时跑一次「不注入 context」的对照组"
        type: choice
        options: ["yes", "no"]
        default: "yes"
      pytorch_context:
        description: "是否用官方 bf16 实现交叉验证 context 通道（排除量化影响，需下载 ~1.2GB 模型）"
        type: choice
        options: ["no", "yes"]
        default: "no"
      bvid:
        description: "测试视频 BV 号（留空则用缓存里最短的那条）"
        default: ""

permissions:
  contents: read

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  probe:
    name: T4 context 通道探针
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: 安装 libclang（bindgen 需要）
        shell: pwsh
        run: choco install llvm -y --no-progress

      - name: 定位 libclang.dll
        shell: pwsh
        run: |
          $clang = Get-ChildItem -Path "C:\Program Files\LLVM\bin" -Filter "libclang.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $clang) { throw "libclang.dll not found" }
          "LIBCLANG_PATH=$($clang.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LLVM_PATH=$($clang.DirectoryName)"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 缓存 sherpa-onnx 预编译库
        id: cache-sherpa
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\target\sherpa-onnx
          key: sherpa-onnx-v1.12.44-windows-x64-static-release

      - name: 缓存 cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-target-${{ runner.os }}-

      - name: 编译（release）
        run: cargo build --release --locked
        env:
          SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}\target\sherpa-onnx\lib
          SHERPA_ONNX_INCLUDE_DIR: ${{ github.workspace }}\target\sherpa-onnx\include

      - name: 收集运行时 DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exeDir = "target\release"
          Copy-Item "target\sherpa-onnx\bin\*.dll" $exeDir -Force -ErrorAction SilentlyContinue
          $pyDirs = Get-ChildItem "$env:RUNNER_TOOL_CACHE\Python" -Directory -ErrorAction SilentlyContinue
          foreach ($d in $pyDirs) {
            foreach ($sub in Get-ChildItem $d.FullName -Directory -ErrorAction SilentlyContinue) {
              $dll = Join-Path $sub.FullName "python3.dll"
              if (Test-Path $dll) { Copy-Item $dll $exeDir -Force }
            }
          }
          foreach ($p in @("onnxruntime\lib\onnxruntime.dll","cuda\onnxruntime_providers_shared.dll","cuda\onnxruntime_providers_cuda.dll")) {
            $src = Join-Path "target\sherpa-onnx" $p
            if (Test-Path $src) { Copy-Item $src $exeDir -Force }
          }
          Get-ChildItem $exeDir -Filter "*.dll" | Measure-Object | ForEach-Object { "DLL 数：$($_.Count)" }

      - name: 还原模型缓存（复用 master CI 建好的）
        uses: actions/cache/restore@v4
        with:
          path: models-cache/
          key: qwen3-models-v4-0.6B
          fail-on-cache-miss: true

      - name: 还原测试媒体缓存
        uses: actions/cache/restore@v4
        with:
          path: media-cache/
          key: e2e-media-bilibili-v3
          fail-on-cache-miss: true

      - name: 装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install soundfile numpy

      - name: 选定探针片段（取最短的一条）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bv = "${{ inputs.bvid }}"
          if ($bv) {
            $item = Get-ChildItem "media-cache/$bv" -File | Select-Object -First 1
          } else {
            $item = Get-ChildItem "media-cache" -Directory |
              ForEach-Object { Get-ChildItem $_.FullName -File | Select-Object -First 1 } |
              Sort-Object Length | Select-Object -First 1
          }
          if (-not $item) { throw "缓存里没有可用的媒体文件" }
          $out = "probe-in" + $item.Extension
          Copy-Item $item.FullName $out -Force
          "PROBE_MEDIA=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROBE_TITLE=$($item.BaseName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "探针片段：$out（$([math]::Round($item.Length/1MB,1)) MB）"

      - name: "T4a 对照组：不注入 context（应当输出日语）"
        if: inputs.control == 'yes'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & "target\release\qwen3-subtitle-assistant.exe" --input "$env:PROBE_MEDIA" `
            --asr-only --output-dir out/probe-baseline --device cpu --asr-threads 4 --verbose *>&1 |
            Tee-Object -FilePath probe-baseline.log
          "T4a 退出码：$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { Get-Content probe-baseline.log -Tail 25 }

      - name: "T4b 实验组：把翻译指令塞进 system 段"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & "target\release\qwen3-subtitle-assistant.exe" --input "$env:PROBE_MEDIA" `
            --asr-only --asr-hotwords "${{ inputs.hotwords }}" `
            --output-dir out/probe-hotwords --device cpu --asr-threads 4 --verbose *>&1 |
            Tee-Object -FilePath probe-hotwords.log
          "T4b 退出码：$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { Get-Content probe-hotwords.log -Tail 25 }

      - name: 判定 context 通道是否真能翻译
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          python scripts/probe_asr_context.py --json out/probe-baseline/qwen3-subtitle-assistant.json `
            --title "$env:PROBE_TITLE" | Tee-Object -FilePath probe-report-baseline.txt
          python scripts/probe_asr_context.py --json out/probe-hotwords/qwen3-subtitle-assistant.json `
            --title "$env:PROBE_TITLE" --expect-lang zh --report probe-report-hotwords.txt
          ""; "===== 对照组报告 ====="; Get-Content probe-report-baseline.txt
          ""; "===== 实验组报告 ====="; Get-Content probe-report-hotwords.txt

      - name: 交叉验证（可选）：官方 bf16 实现的 context 通道
        if: inputs.pytorch_context == 'yes'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          pip install -q torch numpy soundfile librosa qwen-asr
          python finetune/probe_context_pytorch.py --media "$env:PROBE_MEDIA" `
            --context "${{ inputs.hotwords }}" | Tee-Object -FilePath probe-report-pytorch.txt

      - name: 上传探针产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-asr-context
          path: |
            probe-report-*.txt
            probe-*.log
            out/probe-baseline/qwen3-subtitle-assistant.json
            out/probe-hotwords/qwen3-subtitle-assistant.json
          if-no-files-found: warn
