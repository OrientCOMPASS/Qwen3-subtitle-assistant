# ============================================================================
# 端到端真实测试：多语言音频/视频 -> Qwen3-ASR 转录 -> 逐句 LLM 质检 -> 翻译
#
# 媒体源级联：
#   1. workflow_dispatch 指定 URL（YouTube 用 yt-dlp，其他直链用 curl）
#   2. 默认：多语言测试矩阵（HF 镜像仓库 test_wavs：日/德/法/中英混说/纯噪音）
#      —— 噪音样本用于验证 QC 的 drop 判决；transcript.txt 提供参考文本
#   注：YouTube 与 bilibili 对 GitHub runner（数据中心 IP）均有风控
#   （YouTube: "Sign in to confirm you're not a bot"；bilibili: HTTP 412），
#   实测无法稳定拉取，故默认矩阵使用 HF 测试音频（已入模型缓存，零风控）。
# 产物（.srt/.raw.srt/.verified.srt + 完整日志）作为 artifact 上传供人工评估。
#
# 触发方式：
#   1. workflow_dispatch（可自定义视频 URL）
#   2. 推送 e2e-* tag（跑多语言测试矩阵）
#
# 说明：
#   - GitHub runner 无 GPU，运行时探测会自动落到 CPU 后端（这同时验证了
#     auto 探测与回退链路）；
#   - YouTube 对数据中心 IP 风控较严：yt-dlp 依次尝试多个 player_client，
#     全部失败则回退到 HF 镜像仓库自带的测试音频，保证管线必然被验证；
#   - 模型（~2.1GB）使用 actions/cache 固定 key 缓存，命中后跳过下载。
# ============================================================================
name: e2e-test

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "视频 URL（留空使用默认：Me at the zoo, 19s）"
        required: false
        default: ""
  push:
    tags: ["e2e-*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_LOG: info

jobs:
  transcribe:
    name: YouTube 转录翻译端到端测试
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # 见 build.yml 注释：target/ 不入缓存，避免 sherpa-onnx-prebuilt 缺失导致 LNK1181
          cache-targets: false
          cache-on-failure: true

      - name: Ensure libclang (bindgen)
        shell: pwsh
        run: |
          $candidates = @("$env:ProgramFiles\LLVM\bin", "${env:ChocolateyInstall}\lib\llvm\tools\LLVM\bin")
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $found) {
            choco install llvm --no-progress -y | Out-Null
            $found = "$env:ProgramFiles\LLVM\bin"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$found"

      - name: Install ffmpeg/ffprobe
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y | Out-Null
          RefreshEnv
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Build exe (dynamic-link, CPU)
        run: cargo build --release --locked

      - name: Collect runtime DLLs (fallback for build-script copy)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=== 搜索 llama-cpp-sys-2 构建输出中的全部 DLL ==="
          $found = @()
          Get-ChildItem target/release/build -Directory -Filter "llama-cpp-sys-2-*" | ForEach-Object {
            $outDir = Join-Path $_.FullName "out"
            if (Test-Path $outDir) {
              $dlls = Get-ChildItem -Recurse $outDir -Filter *.dll -File
              $found += $dlls
              $dlls | ForEach-Object { Write-Host "  found: $($_.FullName.Replace((Get-Location).Path, '.')) ($([math]::Round($_.Length/1MB,1)) MB)" }
            }
          }
          if ($found.Count -eq 0) { throw "在构建输出目录中未找到任何 llama/ggml DLL" }
          foreach ($dll in $found) { Copy-Item $dll.FullName target/release/ -Force }
          foreach ($r in @("llama.dll","ggml.dll","ggml-base.dll","llama-common.dll")) {
            if (-not (Test-Path "target/release/$r")) { throw "收集后仍缺少 $r" }
          }
          Write-Host "=== target/release DLL 清单 ==="
          Get-ChildItem target/release -Filter *.dll | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      # ---------------- 模型（缓存） ----------------
      - name: Cache models (~2.1GB)
        id: models-cache
        uses: actions/cache@v4
        with:
          path: models
          key: qwen3-models-asr-int8-vad-llm-q8-v2

      - name: Download models (cache miss)
        if: steps.models-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $asrBase = "https://huggingface.co/jkman2023/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25/resolve/main"
          $asrDir  = "models/sherpa-onnx-qwen3-asr-0.6B-int8"
          New-Item -ItemType Directory -Force -Path "$asrDir/tokenizer" | Out-Null
          $asrFiles = @(
            "conv_frontend.onnx", "encoder.int8.onnx", "decoder.int8.onnx",
            "tokenizer/vocab.json", "tokenizer/merges.txt", "tokenizer/tokenizer_config.json"
          )
          foreach ($f in $asrFiles) {
            Write-Host "downloading $f ..."
            curl.exe -sSL --fail --retry 3 --retry-delay 3 -o "$asrDir/$f" "$asrBase/$f"
            if ($LASTEXITCODE -ne 0) { throw "download failed: $f" }
          }
          curl.exe -sSL --fail --retry 3 -o "models/silero_vad.onnx" "$asrBase/silero_vad.onnx"
          if ($LASTEXITCODE -ne 0) { throw "download failed: silero_vad.onnx" }

          # 多语言测试矩阵音频（日/德/法/中英混说/噪音）+ 参考转写
          New-Item -ItemType Directory -Force -Path "$asrDir/test_wavs" | Out-Null
          foreach ($w in @("ja1.wav","de.wav","fr1.wav","codeswitch.wav","noise2.wav","f1_noise.wav","transcript.txt")) {
            curl.exe -sSL --fail --retry 3 -o "$asrDir/test_wavs/$w" "$asrBase/test_wavs/$w"
            if ($LASTEXITCODE -ne 0) { throw "download failed: test_wavs/$w" }
          }

          New-Item -ItemType Directory -Force -Path "models/Qwen3-1.7B-GGUF" | Out-Null
          Write-Host "downloading Qwen3-1.7B-Q8_0.gguf (~1.8GB) ..."
          curl.exe -sSL --fail --retry 3 --retry-delay 5 -o "models/Qwen3-1.7B-GGUF/Qwen3-1.7B-Q8_0.gguf" `
            "https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf"
          if ($LASTEXITCODE -ne 0) { throw "download failed: Qwen3-1.7B-Q8_0.gguf" }
          Get-ChildItem -Recurse models | Select-Object FullName, Length

      # ---------------- 测试媒体 ----------------
      # ---------------- 测试媒体 ----------------
      - name: Fetch test media (dispatch URL > YouTube attempt > HF multilingual matrix)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path media | Out-Null
          $url = "${{ github.event.inputs.video_url }}"

          if ($url) {
            # 用户指定 URL：YouTube 走 yt-dlp（多 client 尝试），其余按直链下载
            "url=$url" | Out-File media/source.txt -Encoding utf8
            $ok = $false
            if ($url -match "youtube\.com|youtu\.be|bilibili\.com|b23\.tv") {
              pip install --quiet --upgrade yt-dlp
              $clients = if ($url -match "bilibili") { @("default") } else { @("tv_simply","tv","web_safari","android_vr","web") }
              foreach ($client in $clients) {
                Write-Host "--- trying player_client=$client ---"
                $extra = if ($client -eq "default") { @() } else { @("--extractor-args", "youtube:player_client=$client") }
                yt-dlp --no-warnings @extra -f "bestaudio/best" -o "media/source.%(ext)s" $url 2>&1 | Tee-Object -FilePath media/ytdlp.log -Append
                $got = Get-ChildItem media/source.* -Exclude *.txt,*.log -ErrorAction SilentlyContinue
                if ($LASTEXITCODE -eq 0 -and $got) { $ok = $true; break }
              }
            } else {
              curl.exe -sSL --fail --retry 2 -o media/source.media $url
              if ($LASTEXITCODE -eq 0) { $ok = $true }
            }
            if (-not $ok) { Write-Warning "指定 URL 拉取失败（可能被风控），回退多语言测试矩阵" }
          }

          if (-not (Get-ChildItem media/source.* -Exclude *.txt,*.log -ErrorAction SilentlyContinue)) {
            # 默认/回退：HF 镜像 test_wavs 多语言矩阵（已随模型缓存）
            "matrix=hf-test-wavs(ja,de,fr,codeswitch,noise)" | Out-File media/source.txt -Append -Encoding utf8
            $wavs = "models/sherpa-onnx-qwen3-asr-0.6B-int8/test_wavs"
            foreach ($w in @("ja1.wav","de.wav","fr1.wav","codeswitch.wav","noise2.wav")) {
              if (-not (Test-Path "$wavs/$w")) { throw "missing $wavs/$w (模型缓存不完整?)" }
            }
            Write-Host "使用多语言测试矩阵: ja/de/fr/codeswitch/noise2"
          }
          Get-ChildItem media -ErrorAction SilentlyContinue | Select-Object Name, Length

      # ---------------- 运行完整管线 ----------------
      # ---------------- 运行完整管线 ----------------
      - name: Run ASR + QC + Translate pipeline
        shell: pwsh
        run: |
          $explicit = Get-ChildItem media/source.* -Exclude *.txt,*.log -ErrorAction SilentlyContinue
          if ($explicit) {
            $targets = $explicit.FullName
          } else {
            $wavs = "models/sherpa-onnx-qwen3-asr-0.6B-int8/test_wavs"
            $targets = @("ja1.wav","de.wav","fr1.wav","codeswitch.wav","noise2.wav") | ForEach-Object { (Resolve-Path "$wavs/$_").Path }
            # 拷贝到 media/ 下运行，产物集中（exe 在输入文件同目录写 .srt）
            foreach ($t in $targets) { Copy-Item $t media/ }
            $targets = $targets | ForEach-Object { "media/" + (Split-Path $_ -Leaf) }
          }
          Write-Host "=== 待处理文件 ($($targets.Count)) ==="
          $targets | ForEach-Object { Write-Host "  $_"; ffprobe -v error -show_entries format=duration -of csv=p=0 $_ }
          # exe 支持多文件按序处理；单文件失败记录后继续（噪音样本预期"无有效语音"而报错，属正常）
          & ./target/release/subtitle-assistant.exe @targets 2>&1 | Tee-Object -FilePath media/run.log
          Write-Host "exit code: $LASTEXITCODE"
          Get-ChildItem media | Select-Object Name, Length
          # 矩阵模式：只要至少一个文件产出 srt 即视为管线成功（噪音文件允许失败）
          $srtCount = (Get-ChildItem media/*.srt -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch '\.raw\.srt$|\.verified\.srt$' }).Count
          if ($srtCount -eq 0) { throw "没有任何文件产出最终 .srt，管线失败" }
          Write-Host "OK: $srtCount 个文件产出最终字幕"

      - name: Show results
        if: always()
        shell: pwsh
        run: |
          $items = Get-ChildItem media/*.srt -ErrorAction SilentlyContinue | Sort-Object Name
          foreach ($i in $items) {
            Write-Host "`n========== $($i.Name) =========="
            Get-Content $i.FullName -Encoding UTF8
          }
          Write-Host "`n========== 参考转写 (transcript.txt) =========="
          Get-Content models/sherpa-onnx-qwen3-asr-0.6B-int8/test_wavs/transcript.txt -Encoding UTF8 -ErrorAction SilentlyContinue

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            media/*.srt
            media/run.log
            media/ytdlp.log
            media/source.txt
          if-no-files-found: warn
