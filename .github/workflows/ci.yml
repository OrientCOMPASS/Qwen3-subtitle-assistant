# ============================================================================
# 唯一的 CI 工作流。触发规则（按维护者要求收敛）：
#
#   push master / PR   -> 自动构建 + 单元测试 + 冒烟 + 端到端真实测试（S2TT 单模型直出）
#   workflow_dispatch  -> 上述全部，外加「打包快速直出版单文件发行包 + 创建 GitHub Release」
#
# 三个 job：
#   build    编译 exe（纯 CPU 工具链，无需 CUDA Toolkit）+ cargo test + 冒烟
#   e2e      needs build：真实日语视频（bilibili，缓存）+ 长文本回归 + 迁移目录回归
#   release  needs build,e2e：仅手动 dispatch 且勾选 release 时运行
#
# E3 单模型形态：产品只有 llama.cpp 一个推理运行时（Qwen3-ASR S2TT GGUF，mtmd
# 多模态路径），VAD 为内嵌权重的纯 Rust silero v4。CUDA 由用户 --cuda-libs 指定
# 运行库目录后动态加载 ggml-cuda.dll；通用 GPU 走随包 ggml-vulkan.dll；否则 CPU。
# CI 不需要 CUDA Toolkit / Vulkan SDK。
# ============================================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "构建并打包后创建 GitHub Release"
        type: boolean
        default: false
      version:
        description: "Release 版本号（留空 = v + Cargo.toml 版本）"
        type: string
        default: ""
      e2e_media:
        description: "e2e 媒体来源（none = 跳过真实视频用例，只跑回归用例）"
        type: choice
        default: "bilibili"
        options: [bilibili, none]
      video_url:
        description: "自定义媒体 URL（覆盖 bilibili 候选）"
        type: string
        default: ""
      strict_media:
        description: "媒体拉取失败时判失败（默认降级为跳过真实视频用例）"
        type: boolean
        default: false
      media_max:
        description: "真实视频用例最多测几个（留空 = 3；调成 1 可加快迭代）"
        type: string
        default: ""

permissions:
  contents: write # release job 创建 Release 需要

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_LOG: info
  # runner 控制台默认 cp1252：python 输出中文会抛 UnicodeEncodeError（实测踩过），
  # 统一强制 UTF-8 模式。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # e2e 真实测试媒体：bilibili 上的日语视频（1~5 分钟），按顺序尝试，取前 E2E_MAX_FILES 个可用者。
  # 刻意选了三种不同语域：学术演讲 / 正式比赛演讲 / 家庭日常口语。
  # 换视频只需改这里；下载结果进 actions/cache，后续运行不再访问 bilibili。
  E2E_BVIDS: "BV16r421g797 BV1ccdQY8Ee8 BV1jT42167f3 BV1No4y117UC"
  E2E_MAX_FILES: "3"

jobs:
  # ------------------------------------------------------------------ 构建
  build:
    name: 构建 + 单元测试 + 冒烟
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # target/ 入缓存 -> 增量构建（llama.cpp 的 CMake 产物与全部依赖 crate 都能复用，
      # 实测全量 ~9.5 分钟可降到 2~3 分钟）。
      # 注：旧版这里有一段 sherpa-onnx 预编译库缓存的复杂舞步——E3 单模型化后
      # sherpa/ORT 依赖已全部移除，llama.cpp 原生构建产物由上面的依赖缓存完整覆盖。
      - name: Full clean build (release)
        if: inputs.release
        shell: pwsh
        run: |
          Write-Host "release 构建：清空 target 做全量构建"
          Remove-Item -Recurse -Force target -ErrorAction SilentlyContinue

      # llama-cpp-sys-2 的 build.rs 使用 bindgen，需要 libclang
      - name: Ensure libclang (bindgen)
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\LLVM\bin",
            "${env:ChocolateyInstall}\lib\llvm\tools\LLVM\bin"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $found) {
            Write-Host 'libclang not found, installing LLVM via choco ...'
            choco install llvm --no-progress -y | Out-Null
            $found = "$env:ProgramFiles\LLVM\bin"
            if (-not (Test-Path (Join-Path $found 'libclang.dll'))) { throw 'LLVM installation failed' }
          }
          Write-Host "Using LIBCLANG_PATH=$found"
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$found"

      - name: Build release exe (dynamic-link, CPU toolchain only)
        run: cargo build --release  # 不用 --locked：E3 依赖大手术后 lock 由 cargo 收敛（见 Cargo.lock 头注）

      # 构建脚本本应把 DLL 拷到 target/release，但历史上多次失效（LNK/运行时缺件），
      # 这里保留兜底收集，并显式校验关键 DLL 存在。
      # 增量构建的必备兜底：rust-cache 的 cleanProfileTarget 会删掉 target/release 下的
      # 散落文件（exe 会被重新链接出来，但 DLL 不会），而两套 DLL 的"源头"不同：
      #   llama/ggml*.dll        <- target/release/build/llama-cpp-sys-2-*/out（rust-cache 保留 build/）
      #   sherpa-onnx-c-api.dll  <- target/sherpa-onnx-prebuilt/*/lib（只在 build.rs 重跑时才拷贝，
      #                             增量构建下不重跑；该目录由本工作流单独缓存并在构建前还原）
      # 少任何一个都会在运行时报"找不到 DLL"，所以这里显式补齐并校验。
      - name: Collect runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # E3 单模型化：只剩 llama.cpp 家族（含 mtmd 多模态库）。
          # llama-common.dll/mtmd.dll 视 sys crate 构建配置可能存在，收集但不强制。
          $required = @("llama.dll","ggml.dll","ggml-base.dll")

          # 1) llama.cpp / ggml：源头在 target/release/build/llama-cpp-sys-2-*/out（rust-cache 保留 build/）
          $llamaOuts = Get-ChildItem target/release/build -Directory -Filter "llama-cpp-sys-2-*" -ErrorAction SilentlyContinue |
                       ForEach-Object { Join-Path $_.FullName "out" }
          foreach ($d in $llamaOuts) {
            if (-not (Test-Path $d)) { continue }
            Get-ChildItem -Recurse $d -Filter *.dll -File | ForEach-Object {
              $dest = Join-Path "target/release" $_.Name
              if (-not (Test-Path $dest)) { Copy-Item $_.FullName $dest -Force; Write-Host "  + llama : $($_.Name)" }
            }
          }

          $missing = @($required | Where-Object { -not (Test-Path "target/release/$_") })
          if ($missing.Count -gt 0) {
            Write-Host "target/release 现有 DLL:"
            Get-ChildItem target/release -Filter *.dll | Select-Object -ExpandProperty Name
            throw "缺少运行时 DLL: $($missing -join ', ')"
          }
          Write-Host "=== target/release DLL 清单 ==="
          Get-ChildItem target/release -Filter *.dll |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      # 单元测试：VAD 黄金向量回放（silero v4 纯 Rust 实现 vs ORT 产出）、段切分
      # 状态机、ASR 原始输出解析、折行/长 cue 拆分、SRT 读写、模型路径解析。
      # 测试二进制需要能找到原生 DLL。
      - name: Unit tests (cargo test)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\target\release;$env:PATH"
          cargo test --release -- --nocapture --test-threads 1

      - name: Smoke test
        shell: pwsh
        run: |
          Write-Host "=== exe 静态导入表 ==="
          pip install --quiet pefile
          python -c "import pefile; pe=pefile.PE(r'target/release/subtitle-assistant.exe', fast_load=True); pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT']]); print('\n'.join(sorted(e.dll.decode() for e in pe.DIRECTORY_ENTRY_IMPORT)))"

          Write-Host "=== 逐个 LoadLibrary 验证导入项 ==="
          # 必须用【exe 同目录的完整路径】加载：LOAD_WITH_ALTERED_SEARCH_PATH(0x8) 会让
          # 依赖 DLL 也从该目录解析，这才等价于真实启动场景。
          # 旧版用裸 DLL 名加载（搜索路径是 CWD=仓库根，而 DLL 在 target/release 下），
          # 于是 llama.dll / sherpa-onnx-c-api.dll 永远 FAIL——但旧脚本只打印不判定，
          # 这个"验证"其实一直是摆设。
          python -c @"
          import ctypes, os, pefile
          d = os.path.join('target', 'release')
          pe = pefile.PE(os.path.join(d, 'subtitle-assistant.exe'), fast_load=True)
          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT']])
          k32 = ctypes.WinDLL('kernel32')
          SYS = ('api-ms-', 'ext-ms-', 'kernel', 'ntdll', 'bcrypt', 'ucrtbase', 'vcruntime', 'msvcp', 'ws2_32', 'advapi32', 'user32', 'ole32', 'shell32', 'sechost', 'rpcrt4', 'crypt32', 'winmm', 'version', 'shlwapi', 'userenv', 'psapi', 'iphlpapi', 'wldap32', 'normaliz', 'dbghelp', 'gdi32', 'msvcrt')
          bad = []
          for e in pe.DIRECTORY_ENTRY_IMPORT:
              name = e.dll.decode()
              local = os.path.join(d, name)
              target = local if os.path.isfile(local) else name
              ok = bool(k32.LoadLibraryExW(target, None, 0x8))
              where = 'local' if os.path.isfile(local) else 'system'
              print(('OK  ' if ok else 'FAIL'), f'{name:<28}', where)
              if not ok and not name.lower().startswith(SYS):
                  bad.append(name)
          print('non-system import load failures:', bad or 'none')
          raise SystemExit(1 if bad else 0)
          "@
          if ($LASTEXITCODE -ne 0) { throw "导入项加载验证失败（见上方 FAIL 行）" }

          Write-Host "=== --version / --help ==="
          $ver = & ./target/release/subtitle-assistant.exe --version 2>&1
          $verExit = $LASTEXITCODE
          Write-Host $ver
          if ($verExit -ne 0) { throw "--version 退出码 $verExit" }
          # 先整体捕获再截取：`--help | Select-Object -First N` 会提前关闭管道，
          # 让上游原生命令被杀，$LASTEXITCODE 变成非 0（假失败）。
          $help = & ./target/release/subtitle-assistant.exe --help 2>&1
          $helpExit = $LASTEXITCODE
          $help | Select-Object -First 10
          Write-Host "HELP_EXIT=$helpExit"
          if ($helpExit -ne 0) { throw "--help 退出码 $helpExit" }

      - name: Upload runtime bundle (exe + DLL)
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-runtime
          path: |
            target/release/subtitle-assistant.exe
            target/release/*.dll
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- 端到端测试
  e2e:
    name: e2e（真实日语视频 + 长文本回归 + 迁移目录回归）
    needs: build
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Download runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: win-x64-runtime
          # upload-artifact 会以多个 path 的**最小公共祖先**作为压缩包根，
          # 因此包内是 subtitle-assistant.exe / *.dll（不含 target/release 前缀），
          # 必须显式下载到 target/release，否则 exe 会落在仓库根、后续步骤找不到。
          path: target/release

      - name: Console UTF-8
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          Write-Host "PYTHONUTF8=$env:PYTHONUTF8 PYTHONIOENCODING=$env:PYTHONIOENCODING"

      - name: Install ffmpeg / ffprobe
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y | Out-Null
          RefreshEnv
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Install python deps (yt-dlp / pefile)
        shell: pwsh
        run: |
          pip install --quiet --upgrade yt-dlp pefile
          yt-dlp --version

      # ---------------- S2TT GGUF 模型（跨 OS 缓存，由 finetune.yml gguf-e2 产线在
      # ubuntu 上构建后 enableCrossOsArchive 保存；这里 windows 直接还原） ----------------
      # 注意两个 actions/cache 的坑（都实际踩过）：
      # 1) version 哈希包含 path 列表——restore 的 path 必须与 finetune.yml gguf-e2
      #    save 时完全一致（两个根级文件名），否则报 "Cache not found"；
      # 2) 缓存按分支作用域隔离——gguf-e2 必须曾在**本分支**跑过，master 的 CI 才
      #    能看到它存的缓存（换分支开发时先在新分支 dispatch 一次 gguf-e2）。
      - name: Restore s2tt GGUF (1.7B Q4_K_M + mmproj)
        id: gguf-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            s2tt-Q4_K_M.gguf
            mmproj-s2tt-q8.gguf
          key: qwen3-s2tt-gguf-1.7B-v1
          enableCrossOsArchive: true

      - name: 布阵模型目录（models/qwen3-asr-s2tt/{model,mmproj}.gguf）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path s2tt-Q4_K_M.gguf)) {
            throw "s2tt GGUF 缓存缺失——请先手动触发 finetune.yml (mode=gguf-e2, model=1.7B) 构建并保存缓存"
          }
          New-Item -ItemType Directory -Force -Path models/qwen3-asr-s2tt | Out-Null
          Copy-Item s2tt-Q4_K_M.gguf models/qwen3-asr-s2tt/model.gguf -Force
          Copy-Item mmproj-s2tt-q8.gguf models/qwen3-asr-s2tt/mmproj.gguf -Force
          Get-ChildItem models/qwen3-asr-s2tt | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # ---------------- 测试媒体（bilibili 日语视频，缓存） ----------------
      - name: Restore e2e media
        id: media-cache
        if: inputs.e2e_media != 'none'
        uses: actions/cache/restore@v4
        with:
          path: media-cache
          key: e2e-media-bilibili-v3

      - name: Fetch media (cache miss)
        id: fetch-media
        if: inputs.e2e_media != 'none' && steps.media-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path media-cache | Out-Null
          $bvids = @()
          foreach ($b in "$env:E2E_BVIDS".Split(' ')) { if ($b) { $bvids += "--bvid"; $bvids += $b } }
          # 直链优先级：dispatch 输入 > 仓库变量 E2E_MEDIA_URL > bilibili 候选
          # （GitHub runner 的数据中心 IP 被 bilibili 硬封：view/视频页一律 412，
          #   实测 4 个候选 BV + yt-dlp 全灭。维护者在本地跑 scripts/fetch_media.py 下载后，
          #   把直链填到仓库变量 E2E_MEDIA_URL 即可，CI 会下载一次并永久缓存。）
          $use = "${{ inputs.video_url }}"
          if (-not $use) { $use = "${{ vars.E2E_MEDIA_URL }}" }
          $urlArgs = @()
          if ($use) { $urlArgs = @("--url", $use); Write-Host "使用直链: $use" }
          $maxFiles = "${{ inputs.media_max }}"
          if (-not $maxFiles) { $maxFiles = $env:E2E_MAX_FILES }
          python scripts/fetch_media.py --out media-cache --min-secs 60 --max-secs 420 --max-files $maxFiles @urlArgs @bvids
          $ok = $LASTEXITCODE -eq 0
          Add-Content -Path $env:GITHUB_ENV -Value "MEDIA_OK=$ok"
          Get-ChildItem media-cache -ErrorAction SilentlyContinue | Select-Object Name, Length
          # 只有真的拿到 >100KB 的媒体文件才允许写缓存（否则会缓存一个空目录，
          # 之后每轮都"命中缓存"却无媒体可用，比不缓存更糟）
          $got = @(Get-ChildItem media-cache -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 100KB })
          Add-Content -Path $env:GITHUB_OUTPUT -Value "has_media=$([bool]$got)".ToLower()
          if (-not $ok) {
            Write-Warning "媒体拉取失败（bilibili 对数据中心 IP 返回 412，或直链不可达）。T1 将跳过，T2/T3 照常执行。"
            if ("${{ inputs.strict_media }}" -eq "true") { throw "strict_media=true，判定失败" }
          }
          # 关键：pwsh 步骤末尾会 exit $LASTEXITCODE，必须显式归零，
          # 否则"降级跳过"会变成整步失败（上一轮就是这样红的）。
          exit 0

      - name: Save e2e media
        # always()：媒体只要成功拉到一次就永久缓存，之后再也不依赖 bilibili 是否放行
        if: ${{ always() && inputs.e2e_media != 'none' && steps.media-cache.outputs.cache-hit != 'true' && steps.fetch-media.outputs.has_media == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: media-cache
          key: e2e-media-bilibili-v3

      - name: Stage media
        if: inputs.e2e_media != 'none'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path media | Out-Null
          $files = Get-ChildItem media-cache -File -ErrorAction SilentlyContinue |
                   Where-Object { $_.Extension -match '\.(m4a|mp4|webm|mp3|wav|flv|mkv|media)$' } |
                   Sort-Object Name
          if (-not $files) {
            Write-Warning "没有可用媒体文件，真实视频用例将被跳过"
            Add-Content -Path $env:GITHUB_ENV -Value "MEDIA_COUNT=0"
            exit 0
          }
          $staged = @()
          foreach ($f in $files) {
            $dest = "media/video_$($f.BaseName)$($f.Extension)"
            Copy-Item $f.FullName $dest -Force
            $dur = (ffprobe -v error -show_entries format=duration -of csv=p=0 $dest) 2>$null
            Write-Host ("  {0}  {1} MB  {2}s" -f $dest, [math]::Round($f.Length/1MB,2), $dur)
            $staged += $dest
          }
          Add-Content -Path $env:GITHUB_ENV -Value "MEDIA_COUNT=$($staged.Count)"
          Add-Content -Path $env:GITHUB_ENV -Value "MEDIA_LIST=$($staged -join ';')"

      # ============ 回归用例（不依赖网络，先跑，最快拿到关键反馈） ============
      # T3：迁移目录回归（拖拽/快捷方式启动路径）。exe+DLL+prompts 拷到 TEMP，
      #      models 用 junction 指过去，再从非仓库 CWD 启动。
      #      v0.2 把资源路径写死成 CWD 相对路径，这种启动方式必然报"提示词目录不存在"。
      # T3：迁移目录回归（拖拽/快捷方式启动路径）。exe+DLL+模型拷到 TEMP，
      #      从非仓库 CWD 启动 --gguf-selftest：验证 DLL 依赖闭包、模型加载、
      #      exe 目录回退在"绿色便携包"形态下成立。
      - name: T3 迁移目录 + 非仓库 CWD 启动
        shell: pwsh
        run: |
          $repo = $PWD.Path
          $pkg = Join-Path $env:TEMP "qsa-pkg"
          Remove-Item -Recurse -Force $pkg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$pkg\models\qwen3-asr-s2tt" | Out-Null
          Copy-Item target/release/*.dll $pkg/
          Copy-Item target/release/subtitle-assistant.exe $pkg/
          Copy-Item models/qwen3-asr-s2tt/*.gguf "$pkg\models\qwen3-asr-s2tt\"
          Write-Host "从 CWD=$env:TEMP 启动 $pkg\subtitle-assistant.exe --gguf-selftest"
          Push-Location $env:TEMP
          try {
            & (Join-Path $pkg "subtitle-assistant.exe") --gguf-selftest `
                "$pkg\models\qwen3-asr-s2tt\model.gguf" `
                "$pkg\models\qwen3-asr-s2tt\mmproj.gguf" `
                --log-file "$env:TEMP\qsa-t3.log"
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          Write-Host "T3 退出码=$code"
          Copy-Item "$env:TEMP\qsa-t3.log" (Join-Path $repo "media/t3.log") -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { Get-Content "$env:TEMP\qsa-t3.log" -Tail 30; throw "T3 自检失败（详见 media/t3.log）" }

      - name: T3 断言
        shell: pwsh
        run: |
          python -c "import pathlib,sys; t=pathlib.Path('media/t3.log').read_text(encoding='utf-8',errors='replace'); ok='自检通过' in t; print('T3 日志含自检通过:', ok); sys.exit(0 if ok else 1)"
          if ($LASTEXITCODE -ne 0) { throw "T3 断言失败" }

      # ============ T1：真实 bilibili 日语视频全流程（放最后，媒体拉取有不确定性） ============
      # 一次调用喂多个文件：顺带验证"模型跨文件复用"（QC 模式下 ASR+LLM 只加载一次）。
      - name: T1 真实日语视频全流程（S2TT 直出中文）
        shell: pwsh
        run: |
          if (-not $env:MEDIA_LIST) {
            Write-Warning "跳过 T1（无媒体）。这不代表通过：请用 workflow_dispatch 重试或更换 E2E_BVIDS。"
            Add-Content -Path $env:GITHUB_ENV -Value "T1_SKIPPED=1"
            exit 0
          }
          $files = $env:MEDIA_LIST -split ';'
          Write-Host "=== 待处理 $($files.Count) 个视频（单模型直出，无任何 LLM 段） ==="
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & ./target/release/subtitle-assistant.exe --no-pause `
              --asr-model-dir models/qwen3-asr-s2tt `
              --log-file media/t1.log @files
          $code = $LASTEXITCODE
          $sw.Stop()
          Write-Host "T1 退出码=$code 耗时=$([math]::Round($sw.Elapsed.TotalMinutes,1)) 分钟"
          Get-ChildItem media | Select-Object Name, Length | Format-Table -AutoSize
          if ($code -ne 0) { throw "T1 退出码非 0（详见 media/t1.log 末尾）" }

      - name: T1 断言（直出必须是中文、密度达标、排版合规）
        shell: pwsh
        run: |
          if ($env:T1_SKIPPED) { Write-Warning "T1 已跳过"; exit 0 }
          python scripts/check_s2tt_e2e.py translate $env:MEDIA_LIST
          if ($LASTEXITCODE -ne 0) { throw "T1 断言失败" }

      # T1b：任务开关对照——同一模型不带 context 必须仍是日语转写（证明直出中文
      #      是微调+开关的行为，而不是模型被训成"只会中文"）
      - name: T1b 对照（--context 空 → 转写源语言）
        shell: pwsh
        run: |
          if ($env:T1_SKIPPED) { exit 0 }
          $one = ($env:MEDIA_LIST -split ';')[0]
          & ./target/release/subtitle-assistant.exe --no-pause --context "" `
              --asr-model-dir models/qwen3-asr-s2tt --output-dir media/t1b `
              --log-file media/t1b.log $one
          if ($LASTEXITCODE -ne 0) { throw "T1b 退出码非 0" }
          python scripts/check_s2tt_e2e.py transcribe media/t1b
          if ($LASTEXITCODE -ne 0) { throw "T1b 断言失败：不带 context 不再是日语（任务开关失效）" }

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            media/*.srt
            media/*.log
            media/t4/*.srt
          if-no-files-found: warn
          retention-days: 30

  # ----------------------------------------------------------------- 发布
  release:
    name: 打包发行包 + 创建 GitHub Release
    needs: [build, e2e]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Download runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: win-x64-runtime
          path: target/release   # 见 e2e job 中的说明：包内不含 target/release 前缀

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) {
            $m = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
            $v = "v" + $m.Matches[0].Groups[1].Value
          }
          if ($v -notmatch '^v') { $v = "v$v" }
          Write-Host "release version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Restore s2tt GGUF（跨 OS 缓存，path 与 save 端一致）
        uses: actions/cache/restore@v4
        with:
          path: |
            s2tt-Q4_K_M.gguf
            mmproj-s2tt-q8.gguf
          key: qwen3-s2tt-gguf-1.7B-v1
          enableCrossOsArchive: true

      - name: 打包快速直出版单文件包
        shell: pwsh
        run: |
          pip install --quiet pefile
          python scripts/package_fast.py `
            --exe target/release/subtitle-assistant.exe `
            --build-dir target/release `
            --gguf-dir . `
            --version ${{ steps.ver.outputs.version }} `
            --out dist

      - name: Show SHA256SUMS
        shell: pwsh
        run: Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
