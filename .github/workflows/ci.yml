# ============================================================================
# 唯一的 CI 工作流。触发规则：
#
#   push master / PR   -> 构建（4 平台静态单文件）+ 单元测试 + 冒烟 + e2e 真实测试
#   workflow_dispatch  -> 上述全部，外加「收集 4 平台二进制 + 模型 → GitHub Release」
#
# 三个 job：
#   build    矩阵构建单一可执行文件（llama.cpp 静态编入，无任何伴生 DLL/so/dylib），
#            4 腿：windows-x64（Vulkan 静态编入）/ linux-x64（Vulkan + libstdc++/
#            libgomp 静态）/ linux-arm64（纯 CPU）/ macos-arm64（Metal GPU 后端
#            默认编入，腿内硬断言 MTL 设备被发现）。
#            cargo test + 冒烟 + 依赖闭包检查（PE 导入表 / ldd / otool）；
#            可运行的腿顺带真实模型 --gguf-selftest（GGUF 跨 OS 缓存命中时）。
#   e2e      needs build：windows 真实日语视频全流程（T1 默认参数 / T1b 任务开关 /
#            T1c verbose+过滤+raw 对照）+ 迁移目录回归 + 终端清洁度断言。
#   release  needs build,e2e：仅手动 dispatch 且勾选 release 时运行——
#            发布 6 个平台单文件二进制 + S2TT GGUF 模型 + SHA256SUMS 为一个
#            GitHub Release（v0.5 起不再打 1.5GiB 大 zip：exe 与模型分离下载）。
#
# v0.5 形态说明（与 v0.4 的差异）：
#   * 发布物 = 单一可执行文件。llama.cpp（含 mtmd）静态链接进 exe；
#     GPU 加速按平台：macOS=Metal（内嵌，CI 硬断言）；Windows/Linux-x64=Vulkan
#     静态编入（自动发现 N卡/A卡/Intel 核显；无 GPU 设备时运行时回退 CPU）。
#     v0.5.2 起不再发纯 CPU 兼容版（维护者决策）：本版 ggml-vulkan 硬链接
#     vulkan-1 loader（无 dlopen 机制），无 loader 的机器（VM/精简容器）无法
#     启动发行版——该场景走源码构建（不加 vulkan 特性即纯 CPU 单文件）。
#     CUDA：linux 可全静态（cudart/cublas_static，运行仅需驱动 libcuda.so.1），
#     windows 无法静态（NVIDIA 不提供 win 静态 cublas）；体积评估见
#     .github/workflows/cuda-probe.yml（dispatch 实测）。
#   * Windows CRT：双侧动态 CRT（/MD）——exe 依赖 VC++ 2015-2022 发行版的
#     vcruntime140/ucrtbase/vcomp140（OpenMP 运行库无静态版，静态 CRT 无收益；
#     实测强行静态会 LNK2001）。冒烟步骤显式校验 PE 导入闭包。
#   * 默认终端只输出进度/结果级信息；诊断细节进 --log-file（恒 debug 级）或
#     --verbose。e2e 的 T1 对终端输出做「清洁度断言」（scripts/check_console_clean.py）。
#   * 默认只产出一个 <名>.srt；.raw.srt 需 --raw-srt。碎片过滤默认关闭，
#     需 --filter-fragments（T1 断言默认行为，T1c 断言开关行为）。
# ============================================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "构建并打包后创建 GitHub Release"
        type: boolean
        default: false
      version:
        description: "Release 版本号（留空 = v + Cargo.toml 版本）"
        type: string
        default: ""
      e2e_media:
        description: "e2e 媒体来源（none = 跳过真实视频用例，只跑回归用例）"
        type: choice
        default: "bilibili"
        options: [bilibili, none]
      video_url:
        description: "自定义媒体 URL（覆盖 bilibili 候选）"
        type: string
        default: ""
      strict_media:
        description: "媒体拉取失败时判失败（默认降级为跳过真实视频用例）"
        type: boolean
        default: false
      media_max:
        description: "真实视频用例最多测几个（留空 = 3；调成 1 可加快迭代）"
        type: string
        default: ""

permissions:
  contents: write # release job 创建 Release 需要

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # 注意：这里刻意【不设 RUST_LOG】——应用默认终端级别是 info（结果级最小集合），
  # CI 要验证的就是这个出厂默认；T1c 用 --verbose 显式开 debug 对照。
  # runner 控制台默认 cp1252：python 输出中文会抛 UnicodeEncodeError（实测踩过），
  # 统一强制 UTF-8 模式。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # e2e 真实测试媒体：bilibili 上的日语视频（1~5 分钟），按顺序尝试，取前 E2E_MAX_FILES 个可用者。
  # 刻意选了三种不同语域：学术演讲 / 正式比赛演讲 / 家庭日常口语。
  # 换视频只需改这里；下载结果进 actions/cache，后续运行不再访问 bilibili。
  E2E_BVIDS: "BV16r421g797 BV1ccdQY8Ee8 BV1jT42167f3 BV1No4y117UC"
  E2E_MAX_FILES: "3"

jobs:
  # ------------------------------------------------------------------ 构建
  # 4 平台矩阵：每腿产出一个自包含单文件二进制（静态链接 llama.cpp/mtmd）。
  build:
    name: 构建+单测+冒烟 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # v0.5.2：Windows/Linux-x64 只发 Vulkan 版（GPU 自动发现，无 GPU 设备时
          # 运行时优雅回退 CPU——loader 由 GPU 驱动提供，物理机必有）。
          # 纯 CPU 形态仍可随时源码构建（cargo build --release 不加 vulkan 特性），
          # 但不再作为 Release 资产：无 loader 的机器（VM/精简容器）本就无法运行
          # Vulkan 版，这类环境属于开发者自建场景。
          - name: windows-x64
            os: windows-latest
            bin: Qwen3-subtitle-assistant-windows-x64.exe
            exe_suffix: ".exe"
            features: "--features vulkan"
            selftest: false
            vulkan: true
          - name: linux-x64
            os: ubuntu-24.04
            bin: Qwen3-subtitle-assistant-linux-x64
            exe_suffix: ""
            features: "--features vulkan,static-libs"
            selftest: true
            vulkan: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            bin: Qwen3-subtitle-assistant-linux-arm64
            exe_suffix: ""
            features: "--features static-libs"
            selftest: true
            vulkan: false
          - name: macos-arm64
            os: macos-14
            bin: Qwen3-subtitle-assistant-macos-arm64
            exe_suffix: ""
            features: ""
            selftest: true
            vulkan: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Full clean build (release)
        if: inputs.release
        shell: bash
        run: |
          echo "release 构建：清空 target 做全量构建"
          rm -rf target

      # ---------------- 平台准备（libclang for bindgen / 静态库可用性） ----
      # CRT 说明（Windows）：Rust 与 llama.cpp CMake 两侧都用【动态 CRT】（默认 /MD）。
      # 曾尝试双侧静态 CRT（LLAMA_STATIC_CRT=1 + RUSTFLAGS=+crt-static）——实测
      # cmake-rs 的 static_crt 未能把 /MT 传导进 llama.cpp 全部目标（LNK2001
      # __imp_fputs 大爆炸）；且 MSVC OpenMP 运行库 vcomp140.dll 本就没有静态版、
      # 必须随 VC++ 发行版安装，静态 CRT 收益为零。故发布 exe 依赖
      # vcruntime140/ucrtbase/vcomp140（VC++ 2015-2022 Redistributable 组件，
      # 绝大多数 Windows 机器已随常见软件装好）——冒烟步骤显式校验导入闭包。
      - name: Prepare (Windows) — libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\LLVM\bin",
            "${env:ChocolateyInstall}\lib\llvm\tools\LLVM\bin"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $found) {
            Write-Host 'libclang not found, installing LLVM via choco ...'
            choco install llvm --no-progress -y | Out-Null
            $found = "$env:ProgramFiles\LLVM\bin"
            if (-not (Test-Path (Join-Path $found 'libclang.dll'))) { throw 'LLVM installation failed' }
          }
          Write-Host "Using LIBCLANG_PATH=$found"
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$found"

      - name: Prepare (Windows Vulkan 腿) — Vulkan SDK（编译期：头文件/vulkan-1.lib/glslc）
        if: runner.os == 'Windows' && matrix.vulkan
        shell: pwsh
        run: |
          # build.rs 的 vulkan 路径硬性要求 VULKAN_SDK（没有会 panic），
          # llama.cpp 的 find_package(Vulkan COMPONENTS glslc) 也需要 SDK 里的 glslc。
          choco install vulkan-sdk --no-progress -y | Out-Null
          $sdk = [Environment]::GetEnvironmentVariable('VULKAN_SDK', 'Machine')
          if (-not $sdk) {
            $sdk = (Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue |
                    Sort-Object Name -Descending | Select-Object -First 1).FullName
          }
          if (-not $sdk -or -not (Test-Path (Join-Path $sdk 'Lib\vulkan-1.lib'))) {
            throw "Vulkan SDK 安装失败（VULKAN_SDK=$sdk）"
          }
          # MAX_PATH 雷区（实测踩过）：vulkan-shaders-gen 的嵌套 ExternalProject
          # TryCompile 的 vc145.pdb 全路径长达 ~262 字符（D:\a\<repo>\<repo>\target\...
          # ≥ MAX_PATH 260）→ mspdbsrv 打不开 PDB → C1041"cannot open program
          # database"连锁炸掉 configure。对策：CARGO_TARGET_DIR 缩短到 C:\ct
          # （物理路径省 ~50 字符），并 junction 回仓库 target/，让后续步骤沿用
          # target/release 路径约定。注：不要设 CL=/FS——实测会让 CMake 的
          # 编译器识别（compiler-id）直接失败（"C compiler identification is
          # unknown"），且长路径才是根因，/FS 治不了。
          New-Item -ItemType Directory -Force -Path C:\ct | Out-Null
          if (-not (Test-Path "$PWD\target")) {
            New-Item -ItemType Junction -Path "$PWD\target" -Target "C:\ct" | Out-Null
          }
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=C:\ct"
          # MSBuild 调度雷区（实测踩过）：VS18/MSBuild 18 + ggml-vulkan 的
          # CMP0147 NEW（并行自定义构建步骤）会让 vulkan-shaders-gen 的
          # ExternalProject 步骤乱序（install 抢在 configure 完成前跑，报
          # "Not a file: cmake_install.cmake"）。换 Ninja 生成器整体绕开
          # MSBuild 调度（顺带更快、无 FileTracker/PDB 长路径问题）。
          # Ninja + cl.exe 需要 MSVC 环境（INCLUDE/LIB/PATH）→ vcvars64 显式布阵
          # （cmake-rs 只会传 -DCMAKE_C_COMPILER 绝对路径，不会自己跑 vcvars）。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath | Select-Object -First 1
          if (-not $vs) { throw "vswhere 未找到 Visual Studio" }
          cmd /c ('"' + $vs + '\VC\Auxiliary\Build\vcvars64.bat" >NUL 2>&1 && set') | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value ($matches[1] + '=' + $matches[2])
            }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y | Out-Null
          }
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_GENERATOR=Ninja"
          # 双保险：钉死 rustc 的 MSVC 链接器绝对路径，任何 PATH 污染（Git 的
          # GNU link.exe）都够不着
          $msvcBin = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $linker = Join-Path $msvcBin.FullName "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $linker)) { throw "未找到 MSVC link.exe: $linker" }
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker"
          ninja --version
          Write-Host "VULKAN_SDK=$sdk"
          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdk"
          & (Join-Path $sdk 'Bin\glslc.exe') --version | Select-Object -First 1

      - name: Prepare (Linux) — libclang + 静态 libstdc++/libgomp 可用性 (+ Vulkan 腿依赖)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          if ! ldconfig -p | grep -q libclang; then
            sudo apt-get install -y -qq libclang-dev clang >/dev/null
          fi
          LIBCLANG=$(dirname "$(find /usr/lib -name 'libclang.so*' 2>/dev/null | head -1)")
          echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$LIBCLANG"
          if [ "${{ matrix.vulkan }}" = "true" ]; then
            # 编译期：Vulkan 头/loader 桩（libvulkan-dev）+ glslc（Ubuntu 24.04
            # 有独立 glslc 包——glslang-tools 不含 glslc，实测踩过）+
            # spirv-headers（ggml-vulkan find_package(SPIRV-Headers CONFIG
            # REQUIRED)，crate 的 vendored llama.cpp 不带该子模块，实测踩过）；
            # 运行期冒烟：libvulkan1（真 loader；runner 无 ICD，正好覆盖
            # 「loader 在、0 设备 → 优雅回退 CPU」路径）
            sudo apt-get install -y -qq libvulkan-dev glslc spirv-headers libvulkan1 >/dev/null
            glslc --version | head -1
          fi
          # static-libs feature 需要编译器自带静态库（g++/gcc 包内）
          for a in libstdc++.a libgomp.a; do
            p=$(g++ --print-file-name=$a)
            if [ "$p" = "$a" ] || [ ! -f "$p" ]; then
              echo "!! 缺 $a，安装 g++ ..."
              sudo apt-get install -y -qq g++ >/dev/null
              p=$(g++ --print-file-name=$a)
            fi
            echo "$a -> $p"
            [ -f "$p" ] || { echo "静态库 $a 不可用，static-libs 会链接失败"; exit 1; }
          done

      - name: Prepare (macOS) — libclang（brew llvm，缺则装）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          LLVM_PREFIX="$(brew --prefix llvm 2>/dev/null || true)"
          if [ -z "$LLVM_PREFIX" ] || [ ! -f "$LLVM_PREFIX/lib/libclang.dylib" ]; then
            brew install llvm
            LLVM_PREFIX="$(brew --prefix llvm)"
          fi
          echo "LIBCLANG_PATH=$LLVM_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$LLVM_PREFIX/lib"
          # Metal 后端由 llama.cpp 在 Apple 平台默认启用（GGML_METAL_EMBED_LIBRARY
          # 内嵌 shader），无需额外 SDK——Xcode 即全部依赖。

      # ---------------- 构建 + 测试 ----------------
      # shell 用 pwsh 而非 bash（全平台统一）：windows-vulkan 腿布阵了 vcvars
      # 环境（INCLUDE/LIB 已设）后，cc/rustc 走"环境已配置"捷径、直接从 PATH
      # 找 link.exe——而 bash 步骤会把 Git 的 /usr/bin 前置进 PATH，GNU
      # link.exe 顶掉 MSVC 链接器（实测 LNK 爆炸："/usr/bin/link: extra
      # operand"）。pwsh 步骤不注入 Git 路径，vcvars PATH 的 MSVC bin 在最前。
      - name: Build release (static single-file)
        shell: pwsh
        run: cargo build --release ${{ matrix.features }}

      # 单元测试：VAD 黄金向量回放、流式 SegTracker↔批量参照 600 组等价性对拍、
      # 硬拆/合并/pad 语义、ASR 输出解析（含去重/碎片判定）、折行/长 cue 拆分、
      # SRT、模型路径解析。静态链接后测试二进制不再需要任何 DLL/so 布阵。
      # windows-vulkan 腿例外：测试二进制同样静态链接 Vulkan（导入 vulkan-1.dll），
      # runner 无 loader 时起不来；Rust 侧代码与 windows-x64 腿完全一致（vulkan
      # feature 只改 C 构建），测试由其余 5 腿全量覆盖，此腿跳过。
      - name: Unit tests (cargo test)
        if: ${{ !(runner.os == 'Windows' && matrix.vulkan) }}
        shell: bash
        run: cargo test --release -- --test-threads 1

      - name: Smoke — version/help/新 flag 存在性
        # windows-vulkan 腿例外：runner 通常无 vulkan-1.dll，exe 无法启动——
        # 该腿的启动/flag 冒烟并入下方「loader 布阵」步骤（找到 loader 才跑）。
        if: ${{ !(runner.os == 'Windows' && matrix.vulkan) }}
        shell: bash
        run: |
          set -e
          BIN="target/release/Qwen3-subtitle-assistant${{ matrix.exe_suffix }}"
          "$BIN" --version
          "$BIN" --help | head -12
          # v0.5/v0.6 行为开关与重命名后的 flag 必须出现在 CLI 面上
          for f in --raw-srt --verbose --filter-fragments --buffer-mb --greedy --temperature --model-dir --vad-max-seg-secs --max-cue-chars --no-layout; do
            "$BIN" --help | grep -q -- "$f" || { echo "!! --help 缺少 $f"; exit 1; }
          done
          # 旧名以隐藏 alias 保留（不显示在 --help，但必须仍被 clap 接受：
          # 若 alias 失效会报 "unexpected argument"，据此断言）
          out=$("$BIN" --asr-model-dir . 2>&1 || true)
          if echo "$out" | grep -q "unexpected argument"; then
            echo "!! 隐藏 alias --asr-model-dir 失效"; echo "$out" | head -3; exit 1
          fi
          out=$("$BIN" --vad-buffer-secs 30 2>&1 || true)
          if echo "$out" | grep -q "unexpected argument"; then
            echo "!! 隐藏 alias --vad-buffer-secs 失效"; exit 1
          fi
          echo "SMOKE_OK"

      # ---------------- 依赖闭包检查：证明「单一可执行文件」成立 ----------------
      - name: Smoke (Windows) — PE 导入表无非系统 DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install --quiet pefile
          $env:QSA_VULKAN = "${{ matrix.vulkan }}"
          python -c @"
          import os, pefile, sys
          pe = pefile.PE(r'target/release/Qwen3-subtitle-assistant.exe', fast_load=True)
          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT']])
          imports = sorted(e.dll.decode() for e in pe.DIRECTORY_ENTRY_IMPORT)
          print('imports:', imports)
          # 允许：Windows 系统 DLL + VC++ 发行版组件（vcruntime/msvcp/vcomp/api-ms-*）
          SYS = ('api-ms-', 'ext-ms-', 'kernel', 'ntdll', 'bcrypt', 'ucrtbase', 'vcruntime',
                 'msvcp', 'ws2_32', 'advapi32', 'user32', 'ole32', 'shell32', 'sechost',
                 'rpcrt4', 'crypt32', 'winmm', 'version', 'shlwapi', 'userenv', 'psapi',
                 'iphlpapi', 'wldap32', 'normaliz', 'dbghelp', 'gdi32', 'msvcrt', 'vcomp',
                 'userenv', 'setupapi', 'cfgmgr32', 'winspool', 'comdlg32', 'comctl32')
          vk = os.environ.get('QSA_VULKAN') == 'true'
          allowed = SYS + (('vulkan-1',) if vk else ())
          bad = [d for d in imports if not d.lower().startswith(allowed)]
          # 明确断言：不得再依赖 llama/ggml 伴生 DLL（v0.4 形态的残留）
          llama = [d for d in imports if 'llama' in d.lower() or 'ggml' in d.lower() or 'mtmd' in d.lower()]
          has_vk = any(d.lower().startswith('vulkan') for d in imports)
          print('non-system:', bad or 'none', '| llama/ggml imports:', llama or 'none', '| vulkan-1:', has_vk)
          if vk and not has_vk:
              print('!! vulkan 腿的导入表里没有 vulkan-1.dll —— 后端没链进去'); sys.exit(1)
          sys.exit(1 if (bad or llama) else 0)
          "@
          if ($LASTEXITCODE -ne 0) { throw "PE 导入闭包检查失败（单文件形态被破坏或出现未知系统 DLL）" }

      # Windows Vulkan 腿：runner 通常没有 GPU 驱动（无 vulkan-1.dll），exe 会
      # 起不来——从 SDK/系统里找到 loader 布阵到 exe 旁再跑 --version，验证
      # 「静态 Vulkan 版可启动、无 ICD 时优雅回退」。找不到 loader 则降级跳过。
      - name: Smoke (Windows Vulkan 腿) — loader 布阵 + 启动冒烟
        if: runner.os == 'Windows' && matrix.vulkan
        shell: pwsh
        run: |
          $skip = $false
          $sys = "C:\Windows\System32\vulkan-1.dll"
          if (Test-Path $sys) {
            Write-Host "系统已有 vulkan-1.dll"
          } else {
            $found = Get-ChildItem "$env:VULKAN_SDK" -Recurse -Filter vulkan-1.dll -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) {
              Copy-Item $found.FullName target/release/vulkan-1.dll
              Write-Host "已从 SDK 布阵 loader: $($found.FullName)"
            } else {
              Write-Warning "runner 上找不到 vulkan-1.dll，跳过启动冒烟（PE 静态检查已通过）"
              $skip = $true
            }
          }
          if (-not $skip) {
            & ./target/release/Qwen3-subtitle-assistant.exe --version
            if ($LASTEXITCODE -ne 0) { throw "vulkan 版 --version 退出码 $LASTEXITCODE" }
            $help = & ./target/release/Qwen3-subtitle-assistant.exe --help 2>&1
            if ($LASTEXITCODE -ne 0) { throw "vulkan 版 --help 退出码 $LASTEXITCODE" }
            foreach ($f in @("--raw-srt", "--verbose", "--filter-fragments", "--buffer-mb",
                              "--greedy", "--temperature", "--model-dir", "--vad-max-seg-secs",
                              "--max-cue-chars", "--no-layout")) {
              if (-not ($help -match [regex]::Escape($f))) { throw "vulkan 版 --help 缺少 $f" }
            }
            Write-Host "VK_LAUNCH_OK + SMOKE_OK"
          }

      - name: Smoke (Linux) — ldd 无 libstdc++/libgomp/llama/ggml（vulkan 腿须含 libvulkan）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          BIN="target/release/Qwen3-subtitle-assistant${{ matrix.exe_suffix }}"
          ldd "$BIN" | tee /tmp/ldd.txt
          if grep -E 'libstdc\+\+|libgomp|llama|ggml|mtmd' /tmp/ldd.txt; then
            echo "!! 单文件形态被破坏：存在 C++/OpenMP/llama 动态依赖"; exit 1
          fi
          if [ "${{ matrix.vulkan }}" = "true" ]; then
            grep -q 'libvulkan\.so' /tmp/ldd.txt || { echo "!! vulkan 腿未链接 libvulkan"; exit 1; }
            echo "VULKAN_LINK_OK"
          fi
          echo "LDD_OK（仅 glibc 家族系统库$([ "${{ matrix.vulkan }}" = "true" ] && echo ' + libvulkan')）"

      - name: Smoke (macOS) — otool 仅系统库/框架
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          BIN="target/release/Qwen3-subtitle-assistant${{ matrix.exe_suffix }}"
          otool -L "$BIN" | tee /tmp/otool.txt
          # 只允许 /usr/lib、/System 前缀（含 Metal/Foundation 等系统框架）
          if tail -n +2 /tmp/otool.txt | awk '{print $1}' | grep -v -E '^/usr/lib|^/System' ; then
            echo "!! 单文件形态被破坏：存在非系统动态库依赖"; exit 1
          fi
          echo "OTOOL_OK"

      # ---------------- 真实模型自检（GGUF 跨 OS 缓存命中时；验证各架构可推理） --
      - name: Restore s2tt GGUF (selftest 用，允许 miss)
        if: matrix.selftest
        id: gguf-selftest-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            s2tt-Q4_K_M.gguf
            mmproj-s2tt-q8.gguf
          key: qwen3-s2tt-gguf-1.7B-v1
          enableCrossOsArchive: true

      - name: GGUF selftest（真实模型加载 + 后端枚举；mac 腿顺带验证 Metal）
        if: matrix.selftest && steps.gguf-selftest-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -e
          BIN="target/release/Qwen3-subtitle-assistant${{ matrix.exe_suffix }}"
          # 自检结果走 stdout（println），设备选择等 info 走 stderr——合并捕获
          "$BIN" --gguf-selftest s2tt-Q4_K_M.gguf mmproj-s2tt-q8.gguf 2>&1 | tee selftest.out
          grep -q "自检通过" selftest.out
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Metal 设备在 ggml 里叫 MTL0/MTL1（也接受日志里直接出现 Metal 字样）
            # 硬断言：mac 发行版必须带 Metal（GGML_METAL 在 Apple 平台默认 ON、
            # shader 内嵌）。CI 曾实测「选定推理设备: [0] MTL0」；这里从 warning
            # 升级为失败闸门，防止未来工具链变化悄悄把 Metal 弄丢。
            grep -qiE "MTL[0-9]|metal" selftest.out || { echo "::error::macOS 腿未发现 Metal 设备——Metal 后端没编进去？"; exit 1; }
            echo "Metal 后端已发现 ✓"
          fi

      # ---------------- 收集产物 ----------------
      - name: Stage single-file binary
        shell: bash
        run: |
          set -e
          mkdir -p dist-bin
          cp "target/release/Qwen3-subtitle-assistant${{ matrix.exe_suffix }}" "dist-bin/${{ matrix.bin }}"
          chmod +x "dist-bin/${{ matrix.bin }}" || true
          ls -lh dist-bin/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: dist-bin/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- 端到端测试
  e2e:
    name: e2e（真实日语视频 + 终端清洁度 + 输出形态回归 + 迁移目录回归）
    needs: build
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Download windows binary
        uses: actions/download-artifact@v4
        with:
          name: bin-windows-x64
          path: dist-bin

      # 注：e2e 用的就是发行的 windows-x64（Vulkan 内嵌）二进制。runner 镜像带
      # vulkan-1.dll（System32，实测确认）但无 GPU ICD——正好每轮 e2e 都在验证
      # 「loader 在、0 设备 → 回退 CPU」这条发行版降级路径上跑全量真实转录。
      - name: 布阵 exe（后续步骤沿用 target/release/Qwen3-subtitle-assistant.exe 路径）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          Copy-Item dist-bin/Qwen3-subtitle-assistant-windows-x64.exe target/release/Qwen3-subtitle-assistant.exe -Force
          & ./target/release/Qwen3-subtitle-assistant.exe --version

      - name: Console UTF-8
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          Write-Host "PYTHONUTF8=$env:PYTHONUTF8 PYTHONIOENCODING=$env:PYTHONIOENCODING"

      - name: Install ffmpeg / ffprobe
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y | Out-Null
          RefreshEnv
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Install python deps (yt-dlp)
        shell: pwsh
        run: |
          pip install --quiet --upgrade yt-dlp
          yt-dlp --version

      # ---------------- S2TT GGUF 模型（跨 OS 缓存，由 finetune.yml gguf-e2 产线在
      # ubuntu 上构建后 enableCrossOsArchive 保存；这里 windows 直接还原） ----------------
      # 注意两个 actions/cache 的坑（都实际踩过）：
      # 1) version 哈希包含 path 列表——restore 的 path 必须与 finetune.yml gguf-e2
      #    save 时完全一致（两个根级文件名），否则报 "Cache not found"；
      # 2) 缓存按分支作用域隔离——PR 分支可还原 default 分支（master）的缓存。
      - name: Restore s2tt GGUF (1.7B Q4_K_M + mmproj)
        id: gguf-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            s2tt-Q4_K_M.gguf
            mmproj-s2tt-q8.gguf
          key: qwen3-s2tt-gguf-1.7B-v1
          enableCrossOsArchive: true

      - name: 布阵模型目录（v0.6 拍平布局 models/{model,mmproj}.gguf）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path s2tt-Q4_K_M.gguf)) {
            throw "s2tt GGUF 缓存缺失——请先手动触发 finetune.yml (mode=gguf-e2, model=1.7B) 构建并保存缓存"
          }
          # 拍平布局：models/ 直接放两个 GGUF。T1 系列不再传 --asr-model-dir，
          # 用默认发现序实测新布局（旧 qwen3-asr-s2tt 布局兼容由 config.rs 单测覆盖）
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Copy-Item s2tt-Q4_K_M.gguf models/model.gguf -Force
          Copy-Item mmproj-s2tt-q8.gguf models/mmproj.gguf -Force
          Get-ChildItem models | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # ---------------- 测试媒体（bilibili 日语视频，缓存） ----------------
      - name: Restore e2e media
        id: media-cache
        if: inputs.e2e_media != 'none'
        uses: actions/cache/restore@v4
        with:
          path: media-cache
          key: e2e-media-bilibili-v3

      - name: Fetch media (cache miss)
        id: fetch-media
        if: inputs.e2e_media != 'none' && steps.media-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path media-cache | Out-Null
          $bvids = @()
          foreach ($b in "$env:E2E_BVIDS".Split(' ')) { if ($b) { $bvids += "--bvid"; $bvids += $b } }
          # 直链优先级：dispatch 输入 > 仓库变量 E2E_MEDIA_URL > bilibili 候选
          # （GitHub runner 的数据中心 IP 被 bilibili 硬封：view/视频页一律 412，
          #   实测 4 个候选 BV + yt-dlp 全灭。维护者在本地跑 scripts/fetch_media.py 下载后，
          #   把直链填到仓库变量 E2E_MEDIA_URL 即可，CI 会下载一次并永久缓存。）
          $use = "${{ inputs.video_url }}"
          if (-not $use) { $use = "${{ vars.E2E_MEDIA_URL }}" }
          $urlArgs = @()
          if ($use) { $urlArgs = @("--url", $use); Write-Host "使用直链: $use" }
          $maxFiles = "${{ inputs.media_max }}"
          if (-not $maxFiles) { $maxFiles = $env:E2E_MAX_FILES }
          python scripts/fetch_media.py --out media-cache --min-secs 60 --max-secs 420 --max-files $maxFiles @urlArgs @bvids
          $ok = $LASTEXITCODE -eq 0
          Add-Content -Path $env:GITHUB_ENV -Value "MEDIA_OK=$ok"
          Get-ChildItem media-cache -ErrorAction SilentlyContinue | Select-Object Name, Length
          # 只有真的拿到 >100KB 的媒体文件才允许写缓存（否则会缓存一个空目录，
          # 之后每轮都"命中缓存"却无媒体可用，比不缓存更糟）
          $got = @(Get-ChildItem media-cache -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 100KB })
          Add-Content -Path $env:GITHUB_OUTPUT -Value "has_media=$([bool]$got)".ToLower()
          if (-not $ok) {
            Write-Warning "媒体拉取失败（bilibili 对数据中心 IP 返回 412，或直链不可达）。T1 将跳过，T2/T3 照常执行。"
            if ("${{ inputs.strict_media }}" -eq "true") { throw "strict_media=true，判定失败" }
          }
          # 关键：pwsh 步骤末尾会 exit $LASTEXITCODE，必须显式归零，
          # 否则"降级跳过"会变成整步失败（上一轮就是这样红的）。
          exit 0

      - name: Save e2e media
        # always()：媒体只要成功拉到一次就永久缓存，之后再也不依赖 bilibili 是否放行
        if: ${{ always() && inputs.e2e_media != 'none' && steps.media-cache.outputs.cache-hit != 'true' && steps.fetch-media.outputs.has_media == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: media-cache
          key: e2e-media-bilibili-v3

      - name: Stage media
        if: inputs.e2e_media != 'none'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path media | Out-Null
          $files = Get-ChildItem media-cache -File -ErrorAction SilentlyContinue |
                   Where-Object { $_.Extension -match '\.(m4a|mp4|webm|mp3|wav|flv|mkv|media)$' } |
                   Sort-Object Name
          if (-not $files) {
            Write-Warning "没有可用媒体文件，真实视频用例将被跳过"
            Add-Content -Path $env:GITHUB_ENV -Value "MEDIA_COUNT=0"
            exit 0
          }
          $staged = @()
          foreach ($f in $files) {
            $dest = "media/video_$($f.BaseName)$($f.Extension)"
            Copy-Item $f.FullName $dest -Force
            $dur = (ffprobe -v error -show_entries format=duration -of csv=p=0 $dest) 2>$null
            Write-Host ("  {0}  {1} MB  {2}s" -f $dest, [math]::Round($f.Length/1MB,2), $dur)
            $staged += $dest
          }
          Add-Content -Path $env:GITHUB_ENV -Value "MEDIA_COUNT=$($staged.Count)"
          Add-Content -Path $env:GITHUB_ENV -Value "MEDIA_LIST=$($staged -join ';')"

      # ============ 回归用例（不依赖网络，先跑，最快拿到关键反馈） ============
      # T3：迁移目录回归（拖拽/快捷方式启动路径）。exe+模型拷到 TEMP，从非仓库
      #      CWD 启动 --gguf-selftest：v0.5 起 exe 是静态单文件，无 DLL 布阵步骤，
      #      这个用例现在同时证明「单文件绿色便携」形态成立。
      - name: T3 迁移目录 + 非仓库 CWD 启动（单文件形态）
        shell: pwsh
        run: |
          $repo = $PWD.Path
          $pkg = Join-Path $env:TEMP "qsa-pkg"
          Remove-Item -Recurse -Force $pkg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$pkg\models" | Out-Null
          Copy-Item target/release/Qwen3-subtitle-assistant.exe $pkg/
          Copy-Item models/*.gguf "$pkg\models\"
          Write-Host "从 CWD=$env:TEMP 启动 $pkg\Qwen3-subtitle-assistant.exe --gguf-selftest"
          Push-Location $env:TEMP
          try {
            # 自检结果打印在 stdout（println，不受日志级别影响）——合并捕获再断言
            & (Join-Path $pkg "Qwen3-subtitle-assistant.exe") --gguf-selftest `
                "$pkg\models\model.gguf" `
                "$pkg\models\mmproj.gguf" `
                --log-file "$env:TEMP\qsa-t3.log" *> "$env:TEMP\qsa-t3.out"
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          Write-Host "T3 退出码=$code"
          Get-Content "$env:TEMP\qsa-t3.out" -ErrorAction SilentlyContinue
          Copy-Item "$env:TEMP\qsa-t3.out" (Join-Path $repo "media/t3.log") -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { Get-Content "$env:TEMP\qsa-t3.log" -Tail 30 -ErrorAction SilentlyContinue; throw "T3 自检失败（详见 media/t3.log）" }

      - name: T3 断言
        shell: pwsh
        run: |
          python -c "import pathlib,sys; t=pathlib.Path('media/t3.log').read_text(encoding='utf-8',errors='replace'); ok='自检通过' in t; print('T3 输出含自检通过:', ok); sys.exit(0 if ok else 1)"
          if ($LASTEXITCODE -ne 0) { throw "T3 断言失败" }

      # ============ T1：真实日语视频全流程（默认参数 = 用户开箱体验） ============
      # 一次调用喂多个文件：顺带验证"模型跨文件复用"。默认参数下同时回归三个
      # v0.5 用户可见行为：终端清洁（诊断进日志文件）、单 .srt 输出（无 .raw.srt）、
      # 碎片过滤默认关闭。
      - name: T1 真实日语视频全流程（默认参数，捕获终端输出）
        shell: pwsh
        run: |
          if (-not $env:MEDIA_LIST) {
            Write-Warning "跳过 T1（无媒体）。这不代表通过：请用 workflow_dispatch 重试或更换 E2E_BVIDS。"
            Add-Content -Path $env:GITHUB_ENV -Value "T1_SKIPPED=1"
            exit 0
          }
          $files = $env:MEDIA_LIST -split ';'
          Write-Host "=== 待处理 $($files.Count) 个视频（单模型直出，流式 VAD→ASR） ==="
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & ./target/release/Qwen3-subtitle-assistant.exe --no-pause `
              --log-file media/t1.log @files *> media/t1_console.txt
          $code = $LASTEXITCODE
          $sw.Stop()
          Write-Host "T1 退出码=$code 耗时=$([math]::Round($sw.Elapsed.TotalMinutes,1)) 分钟"
          Write-Host "--- 终端输出（应为精简的进度/结果级信息） ---"
          Get-Content media/t1_console.txt
          Write-Host "--- media 目录 ---"
          Get-ChildItem media | Select-Object Name, Length | Format-Table -AutoSize
          if ($code -ne 0) { throw "T1 退出码非 0（详见 media/t1.log 末尾）" }

      - name: T1 断言（直出中文、密度、排版 + 终端清洁 + 单 srt 输出）
        shell: pwsh
        run: |
          if ($env:T1_SKIPPED) { Write-Warning "T1 已跳过"; exit 0 }
          python scripts/check_s2tt_e2e.py translate $env:MEDIA_LIST
          if ($LASTEXITCODE -ne 0) { throw "T1 质量断言失败" }
          # 终端清洁度 + 日志文件全量诊断 + 默认无 .raw.srt
          python scripts/check_console_clean.py media/t1_console.txt media/t1.log
          if ($LASTEXITCODE -ne 0) { throw "T1 终端清洁度断言失败" }
          $raw = @(Get-ChildItem media -Filter *.raw.srt -ErrorAction SilentlyContinue)
          if ($raw.Count -gt 0) { throw "默认不应产出 .raw.srt，实际: $($raw.Name -join ', ')" }
          Write-Host "T1 全部断言通过（质量 + 终端清洁 + 单 srt 输出）"

      # T1b：任务开关对照——同一模型不带 context 必须仍是日语转写（证明直出中文
      #      是微调+开关的行为，而不是模型被训成"只会中文"）
      - name: T1b 对照（--context 空 → 转写源语言）
        shell: pwsh
        run: |
          if ($env:T1_SKIPPED) { exit 0 }
          $one = ($env:MEDIA_LIST -split ';')[0]
          & ./target/release/Qwen3-subtitle-assistant.exe --no-pause --context "" `
              --output-dir media/t1b --log-file media/t1b.log $one
          if ($LASTEXITCODE -ne 0) { throw "T1b 退出码非 0" }
          python scripts/check_s2tt_e2e.py transcribe media/t1b
          if ($LASTEXITCODE -ne 0) { throw "T1b 断言失败：不带 context 不再是日语（任务开关失效）" }

      # T1c：v0.5 三个新开关的对照回归——
      #   --verbose      终端应出现 debug 级明细（逐段 ASR、llama 原生日志）
      #   --filter-fragments  总结行应报告碎片过滤统计
      #   --raw-srt      应额外产出 .raw.srt（且仅在此 flag 下）
      - name: T1c 对照（--verbose --filter-fragments --raw-srt）
        shell: pwsh
        run: |
          if ($env:T1_SKIPPED) { exit 0 }
          $one = ($env:MEDIA_LIST -split ';')[0]
          & ./target/release/Qwen3-subtitle-assistant.exe --no-pause `
              --verbose --filter-fragments --raw-srt --buffer-mb 20 `
              --output-dir media/t1c --log-file media/t1c.log $one *> media/t1c_console.txt
          if ($LASTEXITCODE -ne 0) { throw "T1c 退出码非 0" }
          Get-Content media/t1c_console.txt | Select-Object -First 30
          python scripts/check_console_clean.py media/t1c_console.txt media/t1c.log --verbose-run
          if ($LASTEXITCODE -ne 0) { throw "T1c verbose 断言失败：--verbose 未放开诊断输出" }
          $raw = @(Get-ChildItem media/t1c -Filter *.raw.srt -ErrorAction SilentlyContinue)
          if ($raw.Count -eq 0) { throw "T1c 断言失败：--raw-srt 未产出 .raw.srt" }
          $srt = @(Get-ChildItem media/t1c -Filter *.srt | Where-Object { $_.Name -notlike '*.raw.srt' })
          if ($srt.Count -ne 1) { throw "T1c 断言失败：应有且仅有 1 个最终 srt，实际 $($srt.Count)" }
          # 过滤开启时总结行应带过滤统计
          python -c "import pathlib,sys; t=pathlib.Path('media/t1c.log').read_text(encoding='utf-8',errors='replace'); ok=('碎片过滤' in t) or ('丢弃' in t); print('T1c 日志含过滤统计:', ok); sys.exit(0 if ok else 1)"
          if ($LASTEXITCODE -ne 0) { throw "T1c 断言失败：--filter-fragments 未生效" }
          # 质量断言（目录形态）：过滤开启后的产出仍须是合规中文字幕
          python scripts/check_s2tt_e2e.py translate media/t1c
          if ($LASTEXITCODE -ne 0) { throw "T1c 质量断言失败" }

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            media/*.srt
            media/*.log
            media/*.txt
            media/t1b/*.srt
            media/t1c/*
          if-no-files-found: warn
          retention-days: 30

  # ----------------------------------------------------------------- 发布
  # v0.5 发布物：4 平台单文件二进制 + S2TT GGUF 模型 + SHA256SUMS（不再打大 zip）。
  release:
    name: 收集 4 平台单文件二进制 + 模型 → GitHub Release
    needs: [build, e2e]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          case "$V" in v*) ;; *) V="v$V" ;; esac
          echo "release version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Restore s2tt GGUF（模型资产，跨 OS 缓存，path 与 save 端一致）
        id: gguf-rel
        uses: actions/cache/restore@v4
        with:
          path: |
            s2tt-Q4_K_M.gguf
            mmproj-s2tt-q8.gguf
          key: qwen3-s2tt-gguf-1.7B-v1
          enableCrossOsArchive: true

      - name: Assemble release assets
        shell: bash
        run: |
          set -e
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          ls -lh bins/
          # 4 平台二进制：build 腿已按 Qwen3-subtitle-assistant-<platform> 命名，
          # 版本由 Release tag 承载，文件名不再重复带版本号（v0.6 起，维护者定名）
          for f in Qwen3-subtitle-assistant-windows-x64.exe \
                   Qwen3-subtitle-assistant-linux-x64 \
                   Qwen3-subtitle-assistant-linux-arm64 \
                   Qwen3-subtitle-assistant-macos-arm64; do
            [ -f "bins/$f" ] || { echo "缺少平台产物: $f"; exit 1; }
            cp "bins/$f" "dist/$f"
            chmod +x "dist/$f" || true
          done
          # 模型资产（缓存 miss 则中止——没有模型的 Release 对用户无意义）
          [ "${{ steps.gguf-rel.outputs.cache-hit }}" = "true" ] || {
            echo "s2tt GGUF 缓存缺失，无法随 Release 发布模型"; exit 1; }
          cp s2tt-Q4_K_M.gguf "dist/s2tt-Q4_K_M.gguf"
          cp mmproj-s2tt-q8.gguf "dist/mmproj-s2tt-q8.gguf"
          # 校验和
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt
          ls -lh dist/

      - name: Write release notes
        id: notes
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          cat > RELEASE_BODY.md <<NOTES
          ## $VER —— 单一可执行文件发行

          **下载对应平台的二进制 + 两个模型文件**，按下面目录摆放即可使用（需要系统 PATH 里有 ffmpeg）：

          \`\`\`
          任意目录/
          ├── Qwen3-subtitle-assistant-<平台>  # 本 Release 的单文件二进制（无 DLL/so 伴生）
          └── models/                          # 差一级 models/（也支持与 exe 同级摆放）
              ├── s2tt-Q4_K_M.gguf             # LM（文件名任意，非 mmproj 前缀 .gguf 自动识别）
              └── mmproj-s2tt-q8.gguf          # 音频编码器（mmproj 前缀自动识别）
          \`\`\`

          | 平台 | 资产 | 推理设备 |
          |---|---|---|
          | Windows x64 | \`*-windows-x64.exe\` | **Vulkan：自动发现 NVIDIA/AMD/Intel GPU**；无 GPU 自动回退 CPU（OpenMP）。需 GPU 驱动（自带 vulkan-1.dll）+ VC++ 2015-2022 运行库（vcruntime140/vcomp140，绝大多数机器已装；缺失时装 https://aka.ms/vs/17/release/vc_redist.x64.exe ）；CPU 需 AVX2（2013 年后 x64 均可） |
          | Linux x64 | \`*-linux-x64\` | Vulkan（桌面发行版标配 libvulkan.so.1）→ CPU 回退；glibc ≥ 2.39 |
          | Linux arm64 | \`*-linux-arm64\` | 纯 CPU（armv8-a 基线，树莓派 4 及以上均可） |
          | macOS Apple Silicon | \`*-macos-arm64\` | **Metal GPU 加速**（CI 实测选定 MTL 设备），CPU 兜底 |

          注：Windows/Linux-x64 版内嵌 Vulkan 后端，**启动依赖系统 Vulkan loader**（vulkan-1.dll / libvulkan.so.1，GPU 驱动/桌面发行版必有）；完全无驱动的 VM/容器环境请自行源码构建纯 CPU 版（\`cargo build --release\`，不加 vulkan 特性）。

          用法：把视频/音频拖到可执行文件上，或 \`Qwen3-subtitle-assistant-<平台> 视频.mp4\`；
          同目录得到排版好的 \`视频.srt\`（默认直出中文；\`--context ""\` 转写源语言）。

          ### v0.5.x / v0.6 相对 v0.4 的行为变化
          * **单一可执行文件**：llama.cpp/mtmd 静态链接进二进制。Windows/Linux-x64
            内嵌 **Vulkan**（自动发现 N卡/A卡/Intel 核显，无 GPU 设备自动回退 CPU；
            启动依赖系统 Vulkan loader——GPU 驱动/桌面发行版必有）；macOS 内嵌
            **Metal**；Linux arm64 纯 CPU。v0.5.2 起不再发纯 CPU 兼容版。
          * **流式管线**：VAD 切出一段立即送 ASR（不再全片切完再整批转录），首条字幕
            等待时间 ≈ 第一句话时长；内存有界。实测同素材全流程提速 ~40%。
          * **终端默认干净但保留产出**：逐条识别出的字幕内容（[ASR✔] 时间戳+文本）
            照常打印；模型加载/跳过明细等诊断转入 \`--log-file\`（恒全量）或 \`--verbose\`。
          * **相邻重复句自动丢弃**：与上一条字幕完全相同的识别结果（重复音频/
            幻觉循环）不再进字幕（v0.5.1）。
          * **单输出文件**：默认只产出 \`.srt\`；排版前对照 \`.raw.srt\` 需 \`--raw-srt\`。
          * **碎片过滤默认关闭**：lang=None 短碎片的启发式丢弃需显式 \`--filter-fragments\`
            （空文本段始终跳过——无内容可写）。
          * **v0.6.4 幻觉治理再收紧**：① 复读压缩分级——词组级单元（≥3 字符）
            重复 ≥2 遍只留 1 遍（短语池循环素材上旧规则的整屏 ×2 残留清除），
            字级单元（1-2 字符）≥3 遍留 2 遍保护"谢谢/哈哈"叠词；② 稀疏文本
            豁免——低字密度段的硬切份数受"字数/4"封顶，杜绝"你/他/妈"式
            单字碎片 cue（宁可少而长）；e2e 断言同步（无单字 cue + 最长 ≤12s）。
          * **v0.6.3 拆分先于判重**：大段拆分/折行移到丢弃检查之前，判重与
            连续语气词按**最终字幕条**粒度执行（拆分产生的相邻重复条如
            "别走！"×3 现在会被拦截）；终端 [ASR✔] 打印的也是拆分后的真实
            字幕条，不再是误导性的拆分前整段原文。
          * **v0.6.2 断句标准恢复**：单条字幕 ≤7s（双模型时代默认；E3 曾误放宽到
            15s 导致过长字幕）且 ≤40 字符（新 --max-cue-chars，语速快时秒数约束不够），
            行宽默认 40（≈20 汉字）；新增 --no-layout 原样输出。
          * **v0.6.1 新增**：**段内复读压缩**——输出字幕里连续重复 ≥3 遍的子串
            只保留 2 遍（幻觉循环如 \"啊！\"×56 → \"啊！啊！\"），压缩后再参与
            判重与语气词规则；跨段与段内两层夹击模型复读。
          * **v0.6 新增**：① 默认温度采样（temp=0.7/top_p=0.8/top_k=20，基座 Qwen3-1.7B
            官方推荐值；\`--greedy\` 回到旧贪心），缓解贪心复读/幻觉循环；
            ② 丢弃规则升级：判重先去标点；「上一条与本次都是纯语气词（哎/啊/嗯/哼…）」
            的连续语气词段丢弃；③ 模型目录拍平：exe 同级或差一级 models/ 均可，
            不再需要 qwen3-asr-s2tt 目录（旧布局仍兼容）；④ 产物更名
            Qwen3-subtitle-assistant；⑤ VAD→ASR 缓冲按**字节**计量（--buffer-mb，
            默认 50MB，满→暂停生产、消费过半→恢复），占用实时显示在进度条；
            ⑥ flag 命名整理 + 常用短参数（-m/-c/-d/-t/-T/-g/-b/-o/-l/-v/-f），
            旧名 --asr-model-dir/--asr-max-new-tokens/--vad-buffer-secs 保留为
            隐藏 alias。
          NOTES
          # 去缩进（heredoc 里的前导空格）
          sed -i 's/^          //' RELEASE_BODY.md
          echo "notes written: $(wc -l < RELEASE_BODY.md) lines"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          files: |
            dist/*

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
