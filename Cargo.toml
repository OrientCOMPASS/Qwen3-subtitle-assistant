[package]
name = "subtitle-assistant"
version = "0.1.0"
edition = "2021"
description = "本地离线字幕转录与翻译助手"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
indicatif = "0.17"
sherpa-onnx = "1.13.6"
llama-cpp-2 = { version = "0.1.154", features = ["sampler"] }
# 新增：引入底层 C 绑定，用于屏蔽 llama.cpp 的原生日志
llama-cpp-sys-2 = "0.1.154"
encoding_rs = "0.8"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true