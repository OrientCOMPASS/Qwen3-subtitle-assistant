[package]
name = "subtitle-assistant"
version = "0.4.0"
edition = "2021"
description = "本地离线字幕助手（S2TT 微调 Qwen3-ASR 单模型直出 · llama.cpp/GGUF · CUDA/Vulkan/CPU · 纯 Rust silero VAD · 字幕排版）"
license = "Unlicense"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
indicatif = "0.17"

# ============================================================================
# 关键设计：两个原生依赖全部使用【动态链接】。
#
# - 编译机（含 GitHub Actions runner）不需要安装 CUDA Toolkit：CUDA 加速由
#   ggml 动态后端（ggml-cuda.dll）在进程内加载，NVIDIA 运行库经 --cuda-libs
#   指定的目录解析；通用 GPU 走 Vulkan（ggml-vulkan.dll 随包，系统自带 loader）。
# - E3 单模型化后唯一原生依赖是 llama.cpp（llama-cpp-sys-2 源码构建，含 mtmd
#   多模态库）；sherpa-onnx/ORT 已随双模型工作流一并移除。
#
# 版本用 "=" 精确锁定：这两个 crate 的 ABI 与运行时 DLL 强绑定，
# 升级时必须同步更新 CI 中下载的 DLL 版本（见 scripts/package_dist.py）。
# ============================================================================
llama-cpp-2 = { version = "=0.1.157", default-features = false, features = [
    "dynamic-link",     # 生成并链接 llama.dll / ggml*.dll（而非静态库）
    "dynamic-backends", # ggml 后端做成运行时模块，从 exe 目录自动发现 ggml-cuda.dll 等
    "openmp",
    "mtmd",             # 多模态（tools/mtmd）：Qwen3-ASR GGUF 的音频编码/拼接推理库
] }
# E3 单模型路线需要 mtmd/ggml 的原始 C 符号（llama-cpp-2 未 re-export sys crate）：
# sys 开 mtmd feature 后 bindgen 会生成 mtmd_* 全量绑定（allowlist "mtmd_.*"）。
# feature 与上面 llama-cpp-2 的选择由 cargo 统一（同版本自动并集）。
llama-cpp-sys-2 = { version = "=0.1.157", default-features = false, features = [
    "dynamic-link", "dynamic-backends", "openmp", "mtmd",
] }

[features]
default = []
# 本地开发者若装有 CUDA Toolkit，想自己编译 CUDA 版 ggml-cuda.dll，可启用：
#   cargo build --release --features cuda-build
# CI 发布包不使用该特性（直接使用 llama.cpp 官方发布的 CUDA DLL）。
cuda-build = ["llama-cpp-2/cuda"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
debug = false
incremental = false
