[package]
name = "subtitle-assistant"
version = "0.6.4"
edition = "2021"
description = "本地离线字幕助手（S2TT 微调 Qwen3-ASR 单模型直出 · llama.cpp/GGUF 静态单文件 · 流式 VAD→ASR · 纯 Rust silero VAD · 字幕排版）"
license = "Unlicense"

# 发行产物名（v0.6 起）：Qwen3-subtitle-assistant(.exe)。
# package 名保持 subtitle-assistant（crate/日志 target 不变，避免无谓 churn）。
[[bin]]
name = "Qwen3-subtitle-assistant"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
indicatif = "0.17"

# ============================================================================
# 关键设计：唯一原生依赖 llama.cpp（llama-cpp-sys-2）**从源码静态链接**进本
# 可执行文件——发布形态是「单一可执行文件」（Windows 无 DLL 伴生文件、Linux /
# macOS 无 .so/.dylib），解压/下载即用。
#
# 与 v0.4 的动态链接差异：
# - 不再随包 llama.dll / ggml*.dll / ggml-vulkan.dll；
# - CPU 后端静态编入；macOS 上 llama.cpp 默认启用 Metal 后端（框架系统自带、
#   shader 内嵌），Apple Silicon GPU 加速开箱即用；
# - Windows/Linux 各发两种单文件：**GPU 版**（`--features vulkan`，Vulkan 后端
#   静态编入，自动发现 NVIDIA/AMD/Intel GPU；硬依赖系统 Vulkan loader——GPU
#   驱动必带）与**兼容版**（纯 CPU，任何机器可启动）。CUDA 后端（需 Toolkit
#   构建 + 用户 --cuda-libs 运行库目录）仅在动态链接形态下可用：
#   `cargo build --release --features dynamic-link`（见 README「开发」）。
#
# 版本用 "=" 精确锁定：该 crate 内嵌 llama.cpp 源码构建，ABI 与 mtmd 头文件
# 强绑定，升级需同步回归 e2e。
# ============================================================================
llama-cpp-sys-2 = { version = "=0.1.157", default-features = false, features = [
    "openmp",
    "mtmd",             # 多模态（tools/mtmd）：Qwen3-ASR GGUF 的音频编码/拼接推理库
] }

[features]
default = []
# GPU 版单文件（Windows/Linux）：Vulkan 后端静态编入 exe——仍然是单一可执行
# 文件，但**硬依赖系统的 Vulkan loader**（Windows vulkan-1.dll / Linux
# libvulkan.so.1；凡装了 NVIDIA/AMD/Intel GPU 驱动的机器都有）。无 loader 的
# 环境（VM/精简服务器）请改用不带本特性的兼容版（纯 CPU）。
# ggml-vulkan 在编译期需要 Vulkan SDK/glslc（CI 腿已自动化，见 ci.yml）。
vulkan = ["llama-cpp-sys-2/vulkan"]
# Linux 发布构建：libstdc++ / libgomp 静态链接（配合 CI，产出真正单文件的
# ELF，仅依赖 glibc）。对其他平台是无害 no-op（build.rs 按 target 判定）。
static-libs = ["llama-cpp-sys-2/static-openmp", "llama-cpp-sys-2/static-stdcxx"]
# 本地开发者想编动态链接形态（llama.dll/ggml*.dll 伴生、可注入官方 CUDA/Vulkan
# 后端 DLL）时启用；CI 发布包不使用：
#   cargo build --release --features dynamic-link
dynamic-link = ["llama-cpp-sys-2/dynamic-link", "llama-cpp-sys-2/dynamic-backends"]
# CUDA 后端（需本机 CUDA Toolkit/nvcc）：Linux 可全静态单文件（cudart/cublas
# 静态，运行仅需 NVIDIA 驱动 libcuda.so.1）；Windows 因 NVIDIA 不提供静态
# cublas，产物需 cudart/cublas DLL 伴生（非单文件）。体积实测探针：
# .github/workflows/cuda-probe.yml（cublas_static 是大头，架构列表裁剪可控体积）。
cuda-build = ["llama-cpp-sys-2/cuda"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
debug = false
incremental = false
